name: AWS Migration Tests

on:
  push:
    branches:
      - main
      - feature/aws-bedrock-migration
  pull_request:
    branches:
      - main
      - feature/aws-bedrock-migration
    paths:
      - 'app/services/aws/**'
      - 'app/services/ocr/**'
      - 'app/services/document_processor_v2.rb'
      - 'app/services/scout_aws_integration.rb'
      - 'test/services/aws/**'
      - 'test/integration/aws_bedrock_pipeline_test.rb'

jobs:
  # Fast unit tests with mocked AWS
  unit-tests:
    name: Unit Tests (Mocked AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_marketing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          bundle install --jobs 4 --retry 3

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          RAILS_ENV: test
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run AWS service unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          REDIS_URL: redis://localhost:6379/1
          RAILS_ENV: test
          # Mock AWS credentials (not used in tests, but required for initialization)
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock_key_for_testing
          AWS_SECRET_ACCESS_KEY: mock_secret_for_testing
          RAG_BUCKET: test-bucket
        run: |
          bundle exec rails test test/services/aws/bedrock_knowledge_base_service_test.rb
          bundle exec rails test test/services/aws/comprehend_service_test.rb
          bundle exec rails test test/services/aws/textract_service_test.rb

      - name: Run OCR and processor tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          REDIS_URL: redis://localhost:6379/1
          RAILS_ENV: test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock_key_for_testing
          AWS_SECRET_ACCESS_KEY: mock_secret_for_testing
        run: |
          bundle exec rails test test/services/ocr/dual_mode_service_test.rb
          bundle exec rails test test/services/document_processor_v2_test.rb
          bundle exec rails test test/services/scout_aws_integration_test.rb

      - name: Run integration tests (mocked)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          REDIS_URL: redis://localhost:6379/1
          RAILS_ENV: test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock_key_for_testing
          AWS_SECRET_ACCESS_KEY: mock_secret_for_testing
          RAG_BUCKET: test-bucket
        run: |
          bundle exec rails test test/integration/aws_bedrock_pipeline_test.rb

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/reports/
            log/test.log
          retention-days: 7

  # Optional: Live AWS tests (only on main branch or manual trigger)
  live-aws-tests:
    name: Live AWS Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_marketing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          bundle install --jobs 4 --retry 3

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          RAILS_ENV: test
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run live AWS integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          REDIS_URL: redis://localhost:6379/1
          RAILS_ENV: test
          RUN_AWS_INTEGRATION_TESTS: 'true'
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAG_BUCKET: ${{ secrets.RAG_BUCKET }}
          TEXTRACT_ENABLED: 'true'
          COMPREHEND_ENABLED: 'true'
        run: |
          bundle exec rails test test/integration/aws_bedrock_pipeline_test.rb

      - name: Upload live test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: |
            test/reports/
            log/test.log
          retention-days: 30

  # Coverage reporting
  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_marketing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          bundle install --jobs 4 --retry 3

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          RAILS_ENV: test
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_marketing_test
          RAILS_ENV: test
          COVERAGE: 'true'
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
          RAG_BUCKET: test-bucket
        run: |
          bundle exec rails test test/services/aws/
          bundle exec rails test test/integration/aws_bedrock_pipeline_test.rb

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage.xml
          flags: aws-migration
          name: aws-migration-coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat coverage/.last_run.json >> $GITHUB_STEP_SUMMARY
          fi

  # Notify on failure
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [unit-tests, coverage]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Send notification
        run: |
          echo "AWS Migration tests failed on main branch!"
          # Add your notification logic here (Slack, email, etc.)
