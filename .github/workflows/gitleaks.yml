name: Secret Scanning (GitLeaks)

# Run on all pull requests and pushes to main branches
on:
  pull_request:
    branches: [main, prod, dev]
  push:
    branches: [main, prod, dev]
  workflow_dispatch: # Allow manual trigger

jobs:
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comprehensive scanning

      - name: Install GitLeaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo mv gitleaks /usr/local/bin/

      - name: Run GitLeaks
        id: gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Scan only the PR commits
            gitleaks detect --source . --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --report-format sarif --report-path results.sarif --exit-code 1 || echo "leaks_found=true" >> $GITHUB_OUTPUT
          else
            # Full scan for push events
            gitleaks detect --source . --report-format sarif --report-path results.sarif --exit-code 1 || echo "leaks_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload SARIF report
        if: steps.gitleaks.outputs.leaks_found == 'true' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Summary
        if: always()
        run: |
          if [ -f results.sarif ] && [ "${{ steps.gitleaks.outputs.leaks_found }}" = "true" ]; then
            echo "### 🔒 GitLeaks Secret Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Potential secrets detected!** Review the findings above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Common false positives can be added to \`.gitleaks.toml\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ GitLeaks Secret Scan Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No secrets detected in the codebase." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if leaks found
        if: steps.gitleaks.outputs.leaks_found == 'true'
        run: exit 1
