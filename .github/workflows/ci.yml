name: CI

on:
  pull_request:
    branches: [main, prod, dev]
  push:
    branches: [dev]

jobs:
  # Quick syntax and security checks (always pass for now)
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      
      - name: Check Ruby syntax
        run: |
          find app lib -name "*.rb" -exec ruby -c {} \; 2>&1 | head -50 || true
          echo "✅ Ruby syntax check complete"
      
      - name: Check ERB syntax
        run: |
          find app/views -name "*.erb" -exec erb -x {} \; > /dev/null 2>&1 || true
          echo "✅ ERB syntax check complete"

  # Security scan (warnings only)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      
      - name: Run Brakeman
        run: |
          gem install brakeman
          brakeman -q -w2 --no-pager || true
          echo "✅ Security scan complete (warnings only)"

  # Solana TypeScript check
  solana:
    name: Solana Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check Solana package.json exists
        run: |
          if [ -f "solana/package.json" ]; then
            echo "✅ Solana package.json found"
          else
            echo "⚠️ No solana/package.json"
          fi

  # Full test suite (BLOCKS PR on failure)
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    continue-on-error: false  # Block PR on test failures
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install JS dependencies
        run: npm install || true
      
      - name: Setup database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/amos_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY_BASE: test-secret-key-base-for-ci
        run: |
          bundle exec rails db:create db:schema:load || echo "DB setup had issues"
      
      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/amos_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY_BASE: test-secret-key-base-for-ci
          COVERAGE: true
          CI: true
        run: |
          bundle exec rails test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
