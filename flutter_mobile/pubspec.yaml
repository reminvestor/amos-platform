name: amos_mobile
description: AMOS Marketing Platform Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  lucide_icons_flutter: ^3.1.6
  flutter_animate: ^4.3.0

  # Networking
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0-beta.4

  # Authentication
  local_auth: ^3.0.0
  pin_code_fields: ^8.0.1

  # URL Launcher
  url_launcher: ^6.2.5

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  freezed_annotation: ^3.1.0

  # QR Code
  qr_flutter: ^4.1.0

  # File Upload
  file_picker: ^10.3.7
  mime: ^2.0.0
  path: ^1.9.0

  # Voice Input
  web_socket_channel: ^3.0.3
  record: ^6.1.2
  permission_handler: ^12.0.1
  audio_session: ^0.2.2

  # Push Notifications
  flutter_local_notifications: ^19.5.0

  # App Badge & Sounds
  flutter_app_badger: ^1.5.0
  audioplayers: ^6.0.0

  # Note: GenUI-style widgets are implemented in lib/genui/ using our own catalog
  # The official genui package has experimental APIs that change frequently

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.7.1
  freezed: ^3.2.3
  flutter_native_splash: ^2.3.9
  mockito: ^5.4.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

# Splash screen configuration
flutter_native_splash:
  color: "#1a1a2e"
  image: assets/images/splash.png
  android_12:
    color: "#1a1a2e"
    image: assets/images/splash.png
