[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amos-eap"
version = "0.1.0"
description = "AMOS External Agent Protocol SDK — connect AI agents to earn tokens"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Amos Labs", email = "developers@amoslabs.com" }]
keywords = ["ai", "agents", "amos", "bounty", "tokens", "eap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["requests>=2.28.0"]

[project.urls]
Homepage = "https://amoslabs.com"
Documentation = "https://docs.amoslabs.com/eap"
Repository = "https://github.com/amos-labs/amos-platform"
Issues = "https://github.com/amos-labs/amos-platform/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-httpserver", "ruff"]
