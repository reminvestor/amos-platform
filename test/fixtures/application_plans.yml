# Application Plan fixtures for testing
# These represent different states of the planning workflow

drafting_plan:
  entity: one
  created_by: one
  name: "Drafting Plan"
  description: "A plan in drafting state"
  archetype: "custom"
  status: "drafting"
  plan_spec:
    modules:
      - name: "Test Module"
        slug: "test_module"
        fields:
          - name: "name"
            field_type: "string"
            required: true
  refinement_history: []
  build_results: {}
  build_log: []

pending_approval_plan:
  entity: one
  created_by: one
  name: "Pending Approval Plan"
  description: "A plan awaiting user approval"
  archetype: "knowledge_base"
  status: "pending_approval"
  plan_spec:
    modules:
      - name: "Articles"
        slug: "articles"
        fields:
          - name: "title"
            field_type: "string"
            required: true
          - name: "content"
            field_type: "text"
        views:
          - list
          - form
          - detail
    agent:
      name: "KB Expert"
      slug: "kb_expert"
      description: "Knowledge base assistant"
    integrations:
      - slug: "intercom"
        purpose: "sync"
  refinement_history: []
  build_results: {}
  build_log: []

approved_plan:
  entity: one
  created_by: one
  name: "Approved Plan"
  description: "A plan that's been approved"
  archetype: "crm"
  status: "approved"
  approved_at: <%= Time.current %>
  plan_spec:
    modules:
      - name: "Contacts"
        slug: "contacts"
        fields:
          - name: "name"
            field_type: "string"
          - name: "email"
            field_type: "email"
    agent:
      name: "CRM Expert"
      slug: "crm_expert"
  refinement_history: []
  build_results: {}
  build_log: []

completed_plan:
  entity: one
  created_by: one
  name: "Completed Plan"
  description: "A successfully built plan"
  archetype: "project_mgmt"
  status: "completed"
  approved_at: <%= 1.hour.ago %>
  build_started_at: <%= 30.minutes.ago %>
  completed_at: <%= Time.current %>
  plan_spec:
    modules:
      - name: "Tasks"
        slug: "tasks"
        fields:
          - name: "title"
            field_type: "string"
  build_results:
    modules:
      - id: 1
        name: "Tasks"
        slug: "tasks"
    agent:
      id: 1
      name: "Task Expert"
    tools:
      - id: 1
        name: "create_task"
  refinement_history: []
  build_log:
    - timestamp: <%= 30.minutes.ago.iso8601 %>
      level: "info"
      message: "Starting build..."

failed_plan:
  entity: two
  created_by: two
  name: "Failed Plan"
  description: "A plan that failed during build"
  archetype: "custom"
  status: "failed"
  approved_at: <%= 1.hour.ago %>
  build_started_at: <%= 30.minutes.ago %>
  error_message: "Failed to create database table"
  plan_spec:
    modules:
      - name: "Broken"
        slug: "broken"
  refinement_history: []
  build_results: {}
  build_log:
    - timestamp: <%= 30.minutes.ago.iso8601 %>
      level: "error"
      message: "Failed to create database table"

