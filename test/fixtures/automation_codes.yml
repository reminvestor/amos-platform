# AutomationCode fixtures for testing

active_notify_on_publish:
  entity: one
  created_by: one
  name: "Notify on Publish"
  slug: "notify-on-publish"
  description: "Send Slack notification when article is published"
  trigger_type: "status_changed"
  trigger_config:
    from: "draft"
    to: "published"
  code: |
    def execute(trigger_data)
      article = record
      
      send_slack_message(
        channel: '#content',
        message: "📚 New article: #{article[:title]}"
      )
      
      log("Notification sent for article #{article[:id]}")
      { success: true, message: 'Notification sent' }
    end
  code_version: 1
  code_generated_at: <%= Time.current %>
  code_generated_by: "claude-sonnet-4-20250514"
  sample_input:
    record:
      id: 1
      title: "Test Article"
      status: "published"
    changes:
      status:
        - "draft"
        - "published"
  sample_output:
    success: true
    message: "Notification sent"
  is_tested: true
  last_tested_at: <%= Time.current %>
  execution_count: 15
  success_count: 14
  error_count: 1
  status: "active"

