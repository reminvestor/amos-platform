scheduled_report:
  entity: one
  created_by: two
  name: "Daily Report"
  slug: "daily-report"
  description: "Generate daily summary report"
  trigger_type: "schedule"
  trigger_config:
    schedule: "daily"
    time: "09:00"
    timezone: "America/New_York"
  code: |
    def execute(trigger_data)
      count = count_records(status: 'active')
      
      notify_role(
        role: 'admin',
        message: "Daily Report: #{count} active records",
        type: 'info'
      )
      
      { success: true, message: 'Report sent', count: count }
    end
  code_version: 1
  is_tested: true
  execution_count: 30
  success_count: 30
  error_count: 0
  status: "active"

