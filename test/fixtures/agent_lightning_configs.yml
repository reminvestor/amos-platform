  mode: observing
  training_strategy: supervised_finetuning
  retrain_frequency_hours: 48
  trace_retention_days: 60
  min_traces_for_training: 50
  optimization_targets:
    reduce_cost: 0.5
    improve_quality: 0.5
  learning_parameters:
    learning_rate: 0.0005
    batch_size: 16
    num_epochs: 2
