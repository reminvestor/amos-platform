one:
  entity: one
  enabled: true
  mode: optimizing
  training_strategy: prompt_optimization
  retrain_frequency_hours: 24
  trace_retention_days: 90
  min_traces_for_training: 100
  optimization_targets:
    reduce_token_usage: 0.3
    improve_success_rate: 0.5
    reduce_latency: 0.2
  learning_parameters:
    learning_rate: 0.001
    batch_size: 32
    num_epochs: 3

