# Docker Compose configuration for AMOS development

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123password
      POSTGRES_DB: agent_marketing_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && yarn install && yarn build && yarn build:css && rails db:prepare && bin/rails server -b 0.0.0.0"
    env_file:
      - .env
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_NAME=agent_marketing_development
      - DB_USERNAME=postgres
      - DB_PASSWORD=123password
      - REDIS_URL=redis://redis:6379/0
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=5
      # AWS Bedrock - Required (add your credentials)
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SES_SENDER=${AWS_SES_SENDER}
      # RAG Configuration
      - RAG_CHUNKING_STRATEGY=${RAG_CHUNKING_STRATEGY:-semantic}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-1000}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-200}
      - RAG_EMBEDDING_CACHE_ENABLED=${RAG_EMBEDDING_CACHE_ENABLED:-true}
      - RAG_EMBEDDING_BATCH_SIZE=${RAG_EMBEDDING_BATCH_SIZE:-100}
      # OpenAI (for RAG embeddings)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-ada-002}
      # Pinecone (for RAG)
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      # Optional services
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - SERPER_API_KEY=${SERPER_API_KEY}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Deepgram (Voice Assistant)
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPGRAM_WEBHOOK_SECRET=${DEEPGRAM_WEBHOOK_SECRET}
      - VOICE_ASSISTANT_ENABLED=${VOICE_ASSISTANT_ENABLED:-true}
      - POLLY_VOICE_ID=${POLLY_VOICE_ID:-Matthew}
      - POLLY_ENGINE=${POLLY_ENGINE:-neural}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bundle install && bundle exec rake solid_queue:start"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      - DB_HOST=db
      - DB_NAME=agent_marketing_development
      - DB_USERNAME=postgres
      - DB_PASSWORD=123password
      - REDIS_URL=redis://redis:6379/0
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=5
      # AWS Bedrock
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SES_SENDER=${AWS_SES_SENDER}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Pinecone
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      # Optional services
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  node_modules:
