# Docker Compose configuration for AMOS development

name: amos

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123password
      POSTGRES_DB: agent_marketing_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Use 6380 to avoid conflicts with other projects
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=1  # Enable data persistence
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/localstack/init.d:/docker-entrypoint-initaws.d
      - localstack_data:/var/lib/localstack  # Persist S3 data
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal s3 ls &>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && yarn install && yarn build && yarn build:css && rails db:prepare && rails runner 'load \"db/seeds/ai_rulesets.rb\"' && bin/rails server -b 0.0.0.0"
    env_file:
      - .env
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_NAME=agent_marketing_development
      - DB_USERNAME=postgres
      - DB_PASSWORD=123password
      - REDIS_URL=redis://redis:6379/0  # Internal Docker network still uses 6379
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=5
      - WEB_CONCURRENCY=2
      # Chromium path for Ferrum (web page capture)
      - CHROME_PATH=/usr/bin/chromium
      - DOCKER_ENV=true
      - DOCKER_CONTAINER=true
      # AWS Bedrock - Required (add your credentials)
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SES_SENDER=${AWS_SES_SENDER}
      # RAG Configuration
      - RAG_CHUNKING_STRATEGY=${RAG_CHUNKING_STRATEGY:-semantic}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-1000}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-200}
      - RAG_EMBEDDING_CACHE_ENABLED=${RAG_EMBEDDING_CACHE_ENABLED:-true}
      - RAG_EMBEDDING_BATCH_SIZE=${RAG_EMBEDDING_BATCH_SIZE:-100}
      # OpenAI (for RAG embeddings)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-ada-002}
      # Pinecone (for RAG)
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      # S3 (for RAG document storage)
      - RAG_BUCKET=${RAG_BUCKET}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      # Sidekiq (for RAG processing)
      - SIDEKIQ_CONCURRENCY=${SIDEKIQ_CONCURRENCY:-10}
      # Optional services
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - SERPER_API_KEY=${SERPER_API_KEY}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Voice Assistant (Eleven Labs + Deepgram)
      - ELEVEN_LABS_API_KEY=${ELEVEN_LABS_API_KEY}
      - ELEVEN_LABS_MODEL=${ELEVEN_LABS_MODEL:-scribe-v3-realtime}
      - ELEVEN_LABS_LANGUAGE=${ELEVEN_LABS_LANGUAGE:-en}
      - ELEVEN_LABS_ENCODING=${ELEVEN_LABS_ENCODING:-pcm_16000}
      - ELEVEN_LABS_SAMPLE_RATE=${ELEVEN_LABS_SAMPLE_RATE:-16000}
      - ELEVEN_LABS_CHANNELS=${ELEVEN_LABS_CHANNELS:-1}
      - ELEVEN_LABS_PUNCTUATE=${ELEVEN_LABS_PUNCTUATE:-true}
      - ELEVEN_LABS_PARTIAL_RESULTS=${ELEVEN_LABS_PARTIAL_RESULTS:-true}
      - ELEVEN_LABS_SPEAKER_DIARIZATION=${ELEVEN_LABS_SPEAKER_DIARIZATION:-false}
      - ELEVEN_LABS_SENTIMENT_ANALYSIS=${ELEVEN_LABS_SENTIMENT_ANALYSIS:-false}
      - ELEVEN_LABS_LATENCY_OPTIMIZED=${ELEVEN_LABS_LATENCY_OPTIMIZED:-true}
      - ELEVEN_LABS_MAX_DURATION=${ELEVEN_LABS_MAX_DURATION:-300}
      - ELEVEN_LABS_SILENCE_TIMEOUT=${ELEVEN_LABS_SILENCE_TIMEOUT:-20}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPGRAM_WEBHOOK_SECRET=${DEEPGRAM_WEBHOOK_SECRET}
      - VOICE_ASSISTANT_ENABLED=${VOICE_ASSISTANT_ENABLED:-true}
      - POLLY_VOICE_ID=${POLLY_VOICE_ID:-Matthew}
      - POLLY_ENGINE=${POLLY_ENGINE:-neural}
      # OpenRouter (for AI Council deep research)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stdin_open: true
    tty: true

  solidqueue-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bundle install && bundle exec rake solid_queue:start"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      - DB_HOST=db
      - DB_NAME=agent_marketing_development
      - DB_USERNAME=postgres
      - DB_PASSWORD=123password
      - REDIS_URL=redis://redis:6379/0
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=5
      # Chromium path for Ferrum (web page capture)
      - CHROME_PATH=/usr/bin/chromium
      - DOCKER_ENV=true
      # AWS Bedrock
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SES_SENDER=${AWS_SES_SENDER}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Pinecone
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      # S3 (for RAG document storage)
      - RAG_BUCKET=${RAG_BUCKET}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      # Sidekiq (for RAG processing)
      - SIDEKIQ_CONCURRENCY=${SIDEKIQ_CONCURRENCY:-10}
      # Optional services
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      # Voice Assistant
      - ELEVEN_LABS_API_KEY=${ELEVEN_LABS_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      # OpenRouter (for AI Council deep research)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stdin_open: true
    tty: true

