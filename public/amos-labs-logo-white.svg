<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="1080" height="1080" fill="#ffffff"/>

  <!-- Cube Icon in brand purple -->
  <g transform="translate(540, 380)">
    <!-- 3D Cube -->
    <!-- Top face -->
    <path d="M 0,-80 L 100,0 L 0,80 L -100,0 Z" fill="#6366f1" opacity="0.95"/>
    <!-- Left face -->
    <path d="M -100,0 L 0,80 L 0,200 L -100,120 Z" fill="#6366f1" opacity="0.75"/>
    <!-- Right face -->
    <path d="M 100,0 L 0,80 L 0,200 L 100,120 Z" fill="#6366f1" opacity="0.85"/>
  </g>

  <!-- AMOS Labs Text in dark -->
  <text x="540" y="720" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="700" fill="#1a1d23" text-anchor="middle">AMOS Labs</text>

  <!-- Subtle tagline -->
  <text x="540" y="800" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="400" fill="#4a5568" text-anchor="middle">AI Business Automation</text>
</svg>
