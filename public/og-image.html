<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #8b5cf6 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 900px;
            padding: 60px;
        }
        .logo {
            font-size: 72px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        .tagline {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            opacity: 0.95;
        }
        .description {
            font-size: 24px;
            font-weight: 400;
            opacity: 0.85;
            line-height: 1.4;
            max-width: 700px;
            margin: 0 auto;
        }
        .accent {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AMOS Labs</div>
        <div class="tagline">Your AI Business Assistant</div>
        <div class="description">
            Like <span class="accent">Jarvis</span> for your company. Automate workflows, analyze data, and scale operations through simple conversation.
        </div>
    </div>
</body>
</html>
