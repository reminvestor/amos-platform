name: "Email Campaign with Template (Autonomous)"
slug: "campaign_with_template_auto"
description: "Create an email campaign and link it to the most recent email template - fully autonomous"
category: "campaign_creation"
keywords:
  - campaign
  - email
  - template
  - link
  - create campaign
  - autonomous

steps:
  - id: "get_template"
    name: "Retrieve Latest Email Template"
    description: "Find the most recent email template to link to the campaign"
    agent_role: "executor"
    type: "tool_call"
    tool: "get_data"
    tool_args:
      object_type: "email_templates"
      options:
        limit: 1
        order_by: "created_at DESC"
    dependencies: []
    required_tools:
      - get_data

  - id: "get_schema"
    name: "Get Campaign Schema"
    description: "Retrieve the campaign object schema to ensure correct field names"
    agent_role: "executor"
    type: "tool_call"
    tool: "get_schema"
    tool_args:
      object_type: "campaign"
    dependencies: []
    required_tools:
      - get_schema

  - id: "create_campaign"
    name: "Create Email Campaign"
    description: "Create a new email campaign linked to the template"
    agent_role: "executor"
    type: "tool_call"
    tool: "create_object"
    tool_args:
      object_type: "campaigns"
      data:
        name: "New Email Campaign"
        status: "draft"
        description: "Email campaign created and linked to template"
        email_template_id: "{{template_id}}"
    dependencies:
      - get_template
      - get_schema
    required_tools:
      - create_object

  - id: "verify_link"
    name: "Verify Template Link"
    description: "Verify that the template was correctly linked to the campaign"
    agent_role: "verifier"
    type: "tool_call"
    tool: "get_data"
    tool_args:
      object_type: "campaigns"
      filters:
        id: "{{campaign_id}}"
      options:
        include: ["email_template"]
    config:
      verification_rules:
        - field: "email_template_id"
          rule: "not_null"
          message: "Campaign must have an email template linked"
    dependencies:
      - create_campaign
    required_tools:
      - get_data

validation:
  required_tools:
    - get_schema
    - get_data
    - create_object
