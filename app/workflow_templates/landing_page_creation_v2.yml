template_version: 2
name: "AI-Powered Landing Page Creation"
slug: "landing_page_creation_v2"
description: "Create professional landing pages conversationally with AI"
category: "content_generation"
industry: "general"
tags: ["marketing", "landing-pages", "conversion", "design"]

config:
  execution_mode: "adaptive"
  context_aware: true
  conversational: true
  self_healing: true

keywords:
  - landing page
  - create page
  - build website
  - web page
  - site
  - design page

phases:
  # Phase 1: Intelligently gather all requirements
  - id: "gather_context"
    type: "gather_context"
    name: "Understand Requirements"
    goal: "Gather all information needed to create a compelling landing page"
    
    required_fields:
      - key: "company_name"
        prompt: "What is your company or business name?"
        required: true
        validation: "text"
      - key: "value_proposition"
        prompt: "What is your main value proposition or key message?"
        required: true
        validation: "text"
      - key: "target_audience"
        prompt: "Who is your target audience?"
        required: true
        validation: "text"
      - key: "call_to_action"
        prompt: "What action do you want visitors to take?"
        required: true
        validation: "text"
      - key: "design_style"
        prompt: "What design style do you prefer? (Modern, Classic, Bold, etc.)"
        required: false
        validation: "text"
    
    context_sources:
      - "workflow_context"      # Check uploaded files FIRST!
      - "direct_conversation"
      - "conversation_history"
      - "entity_profile"
    
    extraction_strategies:
      workflow_context:
        file_types:
          image:
            - "Extract design elements: colors, style, layout ideas"
            - "Identify hero section style, CTA placement"
            - "Note typography and overall aesthetic"
          pdf:
            - "Extract brand guidelines: colors, fonts, logos"
            - "Look for style requirements"
    
    ai_instructions: |
      Gather landing page information intelligently.
      
      PRIORITY ORDER:
      1. Check uploaded files first (screenshots, brand guidelines, inspiration)
      2. Check conversation history
      3. Check business profile for style guidelines
      4. Only ask user for missing information
      
      If user uploaded:
      - Screenshot: Extract design style, colors, layout ideas
      - Brand guidelines: Extract colors, fonts, style rules
      - Images: Note for use in landing page
      
      Ask conversationally for any missing required fields.

  # Phase 2: Build the landing page
  - id: "execute_goal"
    type: "execute_goal"
    name: "Build Landing Page"
    goal: "Create a professional, conversion-optimized landing page with the gathered requirements"
    
    # Define how gathered data maps to tool arguments
    data_mapping:
      tool: "generate_ai_landing_page"
      args:
        title: "{{company_name}}"
        description: "{{value_proposition}}"
        business_name: "{{company_name}}"
        key_details:
          company_name: "{{company_name}}"
          value_proposition: "{{value_proposition}}"
          target_audience: "{{target_audience}}"
          call_to_action: "{{call_to_action}}"
          design_style: "{{design_style}}"
        business_info:
          offer: "{{value_proposition}}"
          target_audience: "{{target_audience}}"
          value_proposition: "{{value_proposition}}"
        design_preferences:
          cta: "{{call_to_action}}"
          style: "{{design_style}}"
    
    execution_strategy:
      approach: "structured"  # Use structured mapping instead of adaptive
      
      allowed_tools:
        - generate_ai_landing_page
      
      success_when:
        landing_page_id_exists: true
        html_generated: true
    
    ai_instructions: |
      Execute the data_mapping defined above using actual context values.
      

  # Phase 3: Validate quality
  - id: "validation"
    type: "validate_result"
    name: "Quality Check"
    goal: "Ensure the landing page meets quality and brand standards"
    
    validation_rules:
      - rule: "responsive_design"
        check: "Page works on mobile, tablet, and desktop"
        
      - rule: "has_cta"
        check: "Clear call-to-action buttons are present"
        
      - rule: "images_valid"
        check: "All images have valid URLs and load properly"
        
      # Disabled html_validity - too strict, causes false failures
      # - rule: "html_validity"
      #   check: "HTML structure is valid and well-formed"
        
      - rule: "brand_consistent"
        check: "Uses uploaded brand colors and follows brand guidelines"
        requires_context: ["uploaded_brand_guide", "brand_colors"]
    
    on_failure:
      action: "attempt_fix"
      max_fix_attempts: 2
      use_fixer_agent: true
      allowed_fixes:
        - add_missing_cta
        - fix_responsive_issues
        - optimize_images
        - adjust_colors_to_brand
        - fix_html_structure

success_criteria:
  - landing_page_created: true
  - quality_validated: true
  - responsive: true
  - has_cta: true

validation:
  required_context:
    - business_context
    - content_requirements
  quality_checks:
    - check_html_validity
    - check_responsive_design
    - verify_cta_presence
