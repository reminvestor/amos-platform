name: "Create App Connection"
slug: "app_connection"
description: "Interactively create a new integration connection with AI assistance"
category: "integration"
keywords:
  - integration
  - app
  - connection
  - api
  - connect
  - setup

steps:
  - id: "gather_requirements"
    name: "Gather App Requirements"
    description: "Collect initial information about the integration"
    agent_role: "planner"
    type: "user_input"
    form:
      title: "App Integration Requirements"
      fields:
        - name: "app_name"
          label: "What application do you want to integrate?"
          type: "text"
          required: true
          placeholder: "e.g., Slack, Salesforce, Shopify"
        - name: "use_case"
          label: "What do you want to do with this integration?"
          type: "textarea"
          required: true
          placeholder: "Describe your use case and what data/actions you need"
        - name: "existing_docs"
          label: "Do you have any API documentation or links?"
          type: "textarea"
          required: false
          placeholder: "Paste any URLs or documentation you already have"
    canvas_allowlist:
      - interactive_wizard

  - id: "generate_search_suggestions"
    name: "Generate Documentation Sources"
    description: "AI generates search suggestions for API documentation"
    agent_role: "planner"
    type: "tool_call"
    tool: "generate_search_suggestions"
    tool_args:
      app_name: "{{app_name}}"
      use_case: "{{use_case}}"
      existing_docs: "{{existing_docs}}"
    dependencies:
      - gather_requirements
    required_tools:
      - generate_search_suggestions
    canvas_allowlist:
      - task_progress

  - id: "search_api_docs"
    name: "Search for API Documentation"
    description: "Execute web searches for API documentation"
    agent_role: "executor"
    type: "tool_call"
    tool: "web_search"
    tool_args:
      search_terms: "{{search_suggestions}}"
      iterate: true
    dependencies:
      - generate_search_suggestions
    required_tools:
      - web_search
    canvas_allowlist:
      - task_progress

  - id: "review_findings"
    name: "Review API Documentation Findings"
    description: "Review and select documentation sources"
    agent_role: "executor"
    type: "user_input"
    form:
      title: "Review Documentation Findings"
      display_context: true
      fields:
        - name: "selected_sources"
          label: "Select which documentation sources to use"
          type: "checkbox_list"
          required: true
          options: "{{search_results}}"
        - name: "additional_docs"
          label: "Upload any API documentation files (PDF, JSON, etc.)"
          type: "file_upload"
          required: false
          accept: ".pdf,.json,.yaml,.yml,.txt,.md"
          multiple: true
        - name: "api_key_location"
          label: "Where do you get API keys for this service?"
          type: "text"
          required: false
          placeholder: "e.g., https://app.example.com/settings/api"
    dependencies:
      - search_api_docs
    canvas_allowlist:
      - interactive_wizard

  - id: "create_rag_store"
    name: "Build Knowledge Base"
    description: "Create RAG store from selected documentation"
    agent_role: "executor"
    type: "tool_call"
    tool: "create_rag_store"
    tool_args:
      app_name: "{{app_name}}"
      search_results: "{{selected_sources}}"
      user_uploads: "{{additional_docs}}"
      documentation: "{{existing_docs}}"
    dependencies:
      - review_findings
    required_tools:
      - create_rag_store
    canvas_allowlist:
      - task_progress

  - id: "generate_integration"
    name: "Generate Integration Configuration"
    description: "AI generates the integration configuration"
    agent_role: "executor"
    type: "tool_call"
    tool: "generate_integration_config"
    tool_args:
      app_name: "{{app_name}}"
      use_case: "{{use_case}}"
      rag_store_id: "{{rag_store_id}}"
    dependencies:
      - create_rag_store
    required_tools:
      - generate_integration_config
    canvas_allowlist:
      - task_progress

  - id: "test_endpoint"
    name: "Test Initial Endpoint"
    description: "Configure and test the connection"
    agent_role: "executor"
    type: "user_input"
    form:
      title: "Test Connection"
      display_context: true
      fields:
        - name: "api_credentials"
          label: "Enter your API credentials"
          type: "json"
          required: true
          schema: "{{auth_schema}}"
        - name: "test_params"
          label: "Test parameters (if needed)"
          type: "json"
          required: false
      actions:
        - name: "test_connection"
          label: "Test Connection"
          type: "tool_call"
          tool: "test_integration_endpoint"
    dependencies:
      - generate_integration
    canvas_allowlist:
      - interactive_wizard

  - id: "review_test_results"
    name: "Review Test Results"
    description: "Review test results and decide next steps"
    agent_role: "verifier"
    type: "user_input"
    form:
      title: "Test Results"
      display_context: true
      fields:
        - name: "test_feedback"
          label: "How did the test go? Any issues?"
          type: "textarea"
          required: true
        - name: "proceed"
          label: "Ready to build out remaining endpoints?"
          type: "select"
          required: true
          options:
            - value: "yes"
              label: "Yes, continue building"
            - value: "iterate"
              label: "No, let's fix issues first"
            - value: "cancel"
              label: "Cancel integration creation"
    dependencies:
      - test_endpoint
    canvas_allowlist:
      - interactive_wizard

  - id: "build_full_integration"
    name: "Build Complete Integration"
    description: "Build out all endpoints for the integration"
    agent_role: "executor"
    type: "tool_call"
    tool: "build_integration_endpoints"
    tool_args:
      integration_id: "{{integration_id}}"
      use_case: "{{use_case}}"
      rag_store_id: "{{rag_store_id}}"
    dependencies:
      - review_test_results
    condition: "proceed == 'yes'"
    required_tools:
      - build_integration_endpoints
    canvas_allowlist:
      - task_progress

  - id: "final_review"
    name: "Final Review and Activation"
    description: "Name and activate the integration"
    agent_role: "executor"
    type: "user_input"
    form:
      title: "Finalize Integration"
      display_context: true
      fields:
        - name: "integration_name"
          label: "Name for this integration"
          type: "text"
          required: true
          default: "{{app_name}} Integration"
        - name: "description"
          label: "Description"
          type: "textarea"
          required: false
        - name: "activate"
          label: "Activate this integration?"
          type: "checkbox"
          default: true
    dependencies:
      - build_full_integration
    canvas_allowlist:
      - integrations_manager

validation:
  required_inputs:
    - app_name
    - use_case
  required_tools:
    - web_search
    - create_rag_store
    - generate_integration_config
    - test_integration_endpoint
    - build_integration_endpoints

