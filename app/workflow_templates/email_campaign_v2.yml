template_version: 2
name: "Email Campaign Builder"
slug: "email_campaign_v2"
description: "Create email campaigns conversationally with AI assistance"
category: "campaign_creation"
industry: "general"
tags: ["marketing", "email", "campaigns", "outreach"]

config:
  execution_mode: "adaptive"
  context_aware: true
  conversational: true
  self_healing: true

keywords:
  - create campaign
  - create email campaign
  - new campaign
  - build campaign
  - set up campaign
  - make campaign
  - start campaign

phases:
  # Phase 1: Gather campaign details
  - id: "gather_campaign_details"
    type: "gather_context"
    name: "Campaign Details"
    goal: "Understand what kind of email campaign to create"

    required_fields:
      - key: "campaign_name"
        prompt: "What would you like to name this email campaign?"
        required: true
        validation: "text"
      - key: "campaign_goal"
        prompt: "What is the main goal of this email campaign?"
        required: true
        validation: "text"

    context_sources:
      priority:
        - workflow_context
        - conversation_history
        - direct_conversation

    ai_instructions: |
      Gather email campaign requirements conversationally.

      CHECK FIRST in conversation history:
      - Has user mentioned campaign purpose?
      - Did they specify a campaign name?

      If missing REQUIRED fields, ask user naturally:
      - campaign_name: "What would you like to name this campaign?"
      - campaign_goal: "What's the main goal of this campaign?"

      Be friendly and ask naturally in one conversational question.

    allowed_tools:
      - get_workflow_context

    completion_criteria:
      all_required_fields_gathered: true

  # Phase 2: Set up the campaign
  - id: "setup_campaign"
    type: "execute_goal"
    name: "Create Campaign"
    goal: "Set up the email campaign with all required components"

    requires_from_previous:
      - campaign_basics
      - targeting
      - content

    execution_strategy:
      approach: "adaptive"

      allowed_tools:
        - create_object
        - update_object
        - get_data

      success_when:
        campaign_created: true

    ai_instructions: |
      Create the email campaign using information from the previous phase.

      CRITICAL - Campaign model ONLY has these fields:
      - name (required) - Use campaign_name from context
      - description (optional) - Use campaign_goal from context
      - status (required) - Always use "draft"
      - email_template_id (optional)
      - scheduled_at (optional)

      IMPORTANT: Do NOT use these fields (they don't exist):
      - campaign_type
      - campaign_goal (only in description)

      Example create_object call:
      {
        "object_type": "campaigns",
        "data": {
          "name": "<campaign_name from context>",
          "description": "<campaign_goal from context>",
          "status": "draft"
        }
      }

      After creating campaign successfully, the workflow is complete.
      Do NOT try to create contact groups or email templates - just the campaign.

    adaptive:
      enabled: true
      max_attempts: 2
      self_healing: true

  # Phase 3: Verify setup
  - id: "verification"
    type: "validate_result"
    name: "Verify Campaign"
    goal: "Ensure campaign is properly configured"

    validation_rules:
      - rule: "ai_check"
        check: "Campaign was created successfully (check workflow context for campaign_id or campaign record)"

    on_failure:
      action: "report_only"
      use_fixer_agent: false

success_criteria:
  - campaign_created: true
  - campaign_validated: true
