template_version: 2
name: "AI-Powered Landing Page Creation"
slug: "landing_page_creation"
description: "Create professional landing pages conversationally with AI"
category: "content_generation"

config:
  execution_mode: "adaptive"
  context_aware: true
  conversational: true
  self_healing: true

keywords:
  - landing page
  - create page
  - build website
  - web page
  - site
  - design page

phases:
  # Phase 1: Intelligently gather all requirements
  - id: "discovery"
    type: "gather_context"
    name: "Understand Requirements"
    goal: "Gather all information needed to create a compelling landing page"
    
    required_knowledge:
      business_context:
        - business_name
        - industry
        - value_proposition
        - target_audience
      design_preferences:
        - style_preference
        - color_scheme
        - brand_colors
      content_requirements:
        - main_headline
        - key_features
        - call_to_action
    
    context_sources:
      priority:
        - workflow_context      # Check uploaded files first
        - conversation_history  # Review what user said
        - entity_profile        # Use known entity data
        - direct_conversation   # Ask user (last resort)
    
    extraction_strategies:
      workflow_context:
        file_types:
          pdf: "Extract brand guidelines, business info, value propositions, target audience, colors, fonts"
          image: "Analyze for brand colors, visual style, design preferences"
          docx: "Extract content, messaging, key features, value propositions"
      conversation_history:
        look_for:
          - business_description
          - goals_and_objectives
          - audience_mentions
          - design_preferences
      entity_profile:
        use_fields:
          - entity.name
          - entity.industry
          - entity.subdomain
    
    ai_instructions: |
      You are gathering information for a landing page creation.
      
      PRIORITY 1: Check workflow_context for uploaded files
      - If there's a brand guide PDF, extract business name, industry, colors, fonts, messaging
      - If there are images, analyze them for brand style and aesthetics
      - If there's a competitor site screenshot, note the design approach
      - Look for any documents with value propositions, features, or audience info
      
      PRIORITY 2: Review conversation history
      - User may have already described their business
      - Look for mentions of target audience, goals, value proposition
      - Note any design preferences mentioned
      
      PRIORITY 3: Check entity profile
      - Use known business name if available
      - Use industry classification if set
      
      PRIORITY 4: Conversational gathering (ONLY FOR MISSING INFO)
      - Ask naturally in chat, don't show forms
      - Group related questions together
      - If you have partial info, acknowledge it and ask for gaps
      - Example: "I can see from your brand guide that you're targeting small businesses 
        with accounting software. What's the main problem you solve for them?"
      
      Be intelligent:
      - Don't ask for what you already have
      - Infer reasonable defaults when appropriate
      - Confirm assumptions rather than asking from scratch
      - Be warm and conversational
    
    allowed_tools:
      - get_workflow_context
      - web_search
      - get_data
    
    completion_criteria:
      all_required_knowledge_gathered: true
      or:
        user_approved_partial_data: true
        max_conversation_turns: 3

  # Phase 2: Build the landing page
  - id: "creation"
    type: "execute_goal"
    name: "Build Landing Page"
    goal: "Create a professional, conversion-optimized landing page with the gathered requirements"
    
    requires_from_previous:
      - business_context
      - design_preferences
      - content_requirements
    
    execution_strategy:
      approach: "adaptive"
      
      allowed_tools:
        - generate_ai_landing_page
        - update_landing_page_content
        - create_object
        - get_workflow_context
        - web_search
      
      constraints:
        must_use_uploaded_images: true
        must_include_cta: true
        max_ai_calls: 5
        budget:
          max_tokens: 10000
      
      success_when:
        landing_page_id_exists: true
        html_generated: true
        responsive_design: true
    
    ai_instructions: |
      Create the landing page using all gathered context intelligently.
      
      INTELLIGENT CREATION PROCESS:
      1. Get uploaded images from workflow_context
      2. Use extracted brand colors for the design
      3. Create page structure with generate_ai_landing_page tool
      4. Include all required sections:
         - Hero section with compelling headline and CTA
         - Value proposition section
         - Features/Benefits (use gathered key features)
         - Social proof section (if applicable)
         - Final CTA section
      
      5. Ensure responsive design (mobile-first)
      6. Optimize for conversion:
         - Clear value proposition above the fold
         - Multiple CTAs placed strategically
         - Social proof elements
         - Fast loading (optimize images)
      
      7. Use brand guidelines:
         - Apply brand colors from uploaded assets
         - Use appropriate fonts
         - Match brand voice and tone
      
      You have flexibility to:
      - Chain multiple tools if needed
      - Self-heal if generation fails
      - Try different approaches to achieve the goal
      - Make intelligent decisions about content placement
      
      Be creative and adaptive to create the best possible page.
    
    adaptive:
      enabled: true
      max_attempts: 3
      self_healing: true
      allow_tool_chaining: true

  # Phase 3: Validate quality
  - id: "validation"
    type: "validate_result"
    name: "Quality Check"
    goal: "Ensure the landing page meets quality and brand standards"
    
    validation_rules:
      - rule: "responsive_design"
        check: "Page works on mobile, tablet, and desktop"
        
      - rule: "has_cta"
        check: "Clear call-to-action buttons are present"
        
      - rule: "images_valid"
        check: "All images have valid URLs and load properly"
        
      - rule: "html_validity"
        check: "HTML structure is valid and well-formed"
        
      - rule: "brand_consistent"
        check: "Uses uploaded brand colors and follows brand guidelines"
        requires_context: ["uploaded_brand_guide", "brand_colors"]
    
    on_failure:
      action: "attempt_fix"
      max_fix_attempts: 2
      use_fixer_agent: true
      allowed_fixes:
        - add_missing_cta
        - fix_responsive_issues
        - optimize_images
        - adjust_colors_to_brand
        - fix_html_structure

success_criteria:
  - landing_page_created: true
  - quality_validated: true
  - responsive: true
  - has_cta: true

validation:
  required_context:
    - business_context
    - content_requirements
  quality_checks:
    - check_html_validity
    - check_responsive_design
    - verify_cta_presence
