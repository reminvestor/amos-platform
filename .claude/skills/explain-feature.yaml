# Explain Feature - Generate user-facing feature documentation
# Creates end-user documentation from code implementation

name: explain-feature
description: Generate user-facing feature documentation from code
version: "1.0"

parameters:
  feature:
    description: "Feature to document (e.g., campaigns, landing_pages, integrations)"
    type: string
    required: false

  audience:
    description: "Target audience: users, admins, or developers"
    type: string
    default: "users"

  format:
    description: "Output format: markdown, html, or help_text"
    type: string
    default: "markdown"

steps:
  - name: Select Feature
    condition: "${{ !parameters.feature }}"
    run: |
      echo "📖 Feature Documentation Generator"
      echo ""
      echo "Select a feature to document:"
      echo ""

      # List available features based on models
      docker-compose run --rm web rails runner "
        models = ActiveRecord::Base.descendants
          .reject(&:abstract_class?)
          .map(&:name)
          .sort

        features = models.select { |m| !['User', 'Entity', 'ApplicationRecord'].include?(m) }

        features.each_with_index do |feature, i|
          puts \"  #{i+1}. #{feature.pluralize}\"
        end
      " 2>/dev/null

      echo ""
    prompt: "Enter feature name:"
    store_as: selected_feature

  - name: Analyze Feature
    run: |
      FEATURE="${{ parameters.feature }}"
      if [ -z "$FEATURE" ]; then
        FEATURE="${{ selected_feature }}"
      fi

      echo "🔍 Analyzing feature: $FEATURE"
      echo ""

      # Analyze code to understand feature
      docker-compose run --rm web rails runner "
        feature_name = '$FEATURE'.singularize.camelize

        begin
          model = feature_name.constantize
        rescue NameError
          puts '❌ Feature not found: $FEATURE'
          exit 1
        end

        puts '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
        puts \"Feature: #{feature_name}\"
        puts '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
        puts ''

        # Get columns
        columns = model.columns.map(&:name).reject { |c| ['id', 'created_at', 'updated_at', 'entity_id'].include?(c) }
        puts 'Fields:'
        columns.each { |c| puts \"  - #{c}\" }
        puts ''

        # Get associations
        associations = model.reflect_on_all_associations
        if associations.any?
          puts 'Related:'
          associations.each { |a| puts \"  - #{a.name} (#{a.macro})\" }
          puts ''
        end

        # Check for controller
        controller_name = feature_name.pluralize + 'Controller'
        begin
          controller = controller_name.constantize
          actions = controller.instance_methods(false).select { |m| !m.to_s.start_with?('_') }
          puts 'Available Actions:'
          actions.each { |a| puts \"  - #{a}\" }
        rescue NameError
          puts 'No controller found'
        end
      " 2>/dev/null

      echo "$FEATURE" > /tmp/explain_feature_name.txt

  - name: Generate User Documentation
    condition: "${{ parameters.audience == 'users' }}"
    run: |
      FEATURE=$(cat /tmp/explain_feature_name.txt)
      AUDIENCE="${{ parameters.audience }}"
      FORMAT="${{ parameters.format }}"

      echo ""
      echo "📝 Generating user documentation..."
      echo ""

      # Generate user-friendly documentation
      cat > /tmp/feature_doc.md <<EOF
# $(echo $FEATURE | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g')

## What is it?

$(echo $FEATURE | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g') allow you to [describe primary purpose].

## How to Use

### Creating a New $(echo $FEATURE | sed 's/s$//' | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g')

1. Navigate to the $(echo $FEATURE | sed 's/_/ /g') section
2. Click "Create New"
3. Fill in the required information:
   - **Name**: Give it a descriptive name
   - **Description**: Add details about this $(echo $FEATURE | sed 's/s$//')
4. Click "Save"

### Managing $(echo $FEATURE | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g')

**View All**: See a list of all your $(echo $FEATURE | sed 's/_/ /g')

**Edit**: Click the edit button to modify details

**Delete**: Remove $(echo $FEATURE | sed 's/_/ /g') you no longer need

## Best Practices

- Use descriptive names
- Keep information up to date
- Review regularly

## Need Help?

If you have questions about $(echo $FEATURE | sed 's/_/ /g'), contact support or check our detailed guides.

---

*This is auto-generated documentation. Customize as needed.*
EOF

      cat /tmp/feature_doc.md

  - name: Generate Admin Documentation
    condition: "${{ parameters.audience == 'admins' }}"
    run: |
      FEATURE=$(cat /tmp/explain_feature_name.txt)

      echo ""
      echo "📝 Generating admin documentation..."
      echo ""

      cat > /tmp/feature_doc.md <<EOF
# $(echo $FEATURE | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g') - Admin Guide

## Overview

Technical details about $(echo $FEATURE | sed 's/_/ /g') management.

## Database Schema

\`\`\`ruby
# Model: app/models/$(echo $FEATURE | sed 's/s$//')_rb
# Table: $(echo $FEATURE)
\`\`\`

## Features

### Creation
- Users can create new $(echo $FEATURE | sed 's/_/ /g')
- Scoped to entity for multi-tenancy
- Validates required fields

### Management
- CRUD operations via web interface
- Can be accessed via Scout AI tools
- Integration with workflow system

## Entity Scoping

All $(echo $FEATURE | sed 's/_/ /g') are scoped to entities. Users can only access $(echo $FEATURE | sed 's/_/ /g') belonging to their entity.

## API Access

$(echo $FEATURE | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g') can be managed via:
- Web interface
- Scout AI (using tools)
- Integration API (if configured)

## Monitoring

Track $(echo $FEATURE | sed 's/_/ /g') usage:
- View counts in admin dashboard
- Check WorkflowExecution logs
- Monitor IntegrationLog for API access

---

*This is auto-generated documentation. Customize as needed.*
EOF

      cat /tmp/feature_doc.md

  - name: Generate Developer Documentation
    condition: "${{ parameters.audience == 'developers' }}"
    run: |
      FEATURE=$(cat /tmp/explain_feature_name.txt)

      echo ""
      echo "📝 Generating developer documentation..."
      echo ""

      docker-compose run --rm web rails runner "
        feature_name = '$FEATURE'.singularize.camelize
        model = feature_name.constantize

        puts \"# #{feature_name} - Developer Reference\"
        puts \"\"
        puts '## Model'
        puts \"\"
        puts '\`\`\`ruby'
        puts \"# File: app/models/#{feature_name.underscore}.rb\"
        puts \"class #{feature_name} < ApplicationRecord\"

        # Associations
        model.reflect_on_all_associations.each do |assoc|
          puts \"  #{assoc.macro} :#{assoc.name}\"
        end

        puts 'end'
        puts '\`\`\`'
        puts \"\"

        # Schema
        puts '## Database Schema'
        puts \"\"
        puts '\`\`\`ruby'
        puts \"# Table: #{model.table_name}\"
        model.columns.each do |col|
          puts \"t.#{col.type} :#{col.name}#{', null: false' unless col.null}\"
        end
        puts '\`\`\`'
        puts \"\"

        # Usage
        puts '## Usage Examples'
        puts \"\"
        puts '\`\`\`ruby'
        puts \"# Create\"
        puts \"#{feature_name}.create!(\"
        puts '  entity: current_entity,'
        puts '  name: \"Example\"'
        puts ')'
        puts \"\"
        puts \"# Query\"
        puts \"#{feature_name}.for_entity(current_entity)\"
        puts \"#{feature_name}.accessible_by(current_user)\"
        puts '\`\`\`'
        puts \"\"

        # Routes
        puts '## Routes'
        puts \"\"
        controller_name = feature_name.underscore.pluralize
        puts \"- GET    /#{controller_name}\"
        puts \"- POST   /#{controller_name}\"
        puts \"- GET    /#{controller_name}/:id\"
        puts \"- PATCH  /#{controller_name}/:id\"
        puts \"- DELETE /#{controller_name}/:id\"
      " 2>/dev/null

  - name: Save Documentation
    run: |
      FEATURE=$(cat /tmp/explain_feature_name.txt)
      AUDIENCE="${{ parameters.audience }}"

      DOC_FILE="docs/features/$(echo $FEATURE | tr '[:upper:]' '[:lower:]')_${AUDIENCE}.md"

      mkdir -p docs/features

      if [ -f /tmp/feature_doc.md ]; then
        cp /tmp/feature_doc.md "$DOC_FILE"
        echo "✅ Documentation saved: $DOC_FILE"
      else
        echo "⚠️  Documentation generated (see output above)"
      fi

      echo ""
      echo "$DOC_FILE" > /tmp/saved_doc_file.txt

  - name: Summary
    run: |
      FEATURE=$(cat /tmp/explain_feature_name.txt)
      DOC_FILE=$(cat /tmp/saved_doc_file.txt 2>/dev/null || echo "")

      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "✅ Feature Documentation Generated"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""
      echo "Feature: $FEATURE"
      echo "Audience: ${{ parameters.audience }}"

      if [ -n "$DOC_FILE" ] && [ -f "$DOC_FILE" ]; then
        echo "File: $DOC_FILE"
        echo ""
        echo "Next steps:"
        echo "  - Review and customize the documentation"
        echo "  - Add screenshots if needed"
        echo "  - Commit to repository"
      fi

      echo ""

      # Cleanup
      rm -f /tmp/explain_feature_name.txt /tmp/feature_doc.md /tmp/saved_doc_file.txt

examples:
  - description: "Generate user documentation (interactive)"
    command: "Use explain-feature"

  - description: "Generate user docs for campaigns"
    command: "Use explain-feature with feature=campaigns audience=users"

  - description: "Generate admin docs"
    command: "Use explain-feature with feature=integrations audience=admins"

  - description: "Generate developer docs"
    command: "Use explain-feature with feature=landing_pages audience=developers"
