  - description: "Start with both unit and E2E tests"
    command: "Use start-feature with tests=both"

  - description: "Start without tests"
    command: "Use start-feature with tests=none"

  - description: "Start for different Azure DevOps project"
    command: "Use start-feature with project=my-project"
