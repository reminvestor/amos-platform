# Start Feature - Interactive GitHub Issues Workflow
# Lists GitHub issues, creates feature branch, generates implementation plan

name: start-feature
description: Create feature branch from GitHub issue with detailed implementation plan
version: "1.0"

parameters:
  repo:
    description: "GitHub repository (format: owner/repo)"
    type: string
    default: "NuvolaNetworks/agent_marketing"

  issue_number:
    description: "Specific issue number (skip interactive selection)"
    type: string
    required: false

  tests:
    description: "Testing preference: unit, e2e, both, none, or ask"
    type: string
    default: "ask"

steps:
  - name: Prepare Git Repository
    run: |
      echo "🔍 Checking Git status..."
      current_branch=$(git branch --show-current)

      if [ "$current_branch" != "main" ]; then
        echo "⚠️  Currently on branch: $current_branch"
        echo "Switching to main..."
        git checkout main || exit 1
      fi

      echo "📥 Pulling latest from origin/main..."
      git pull origin main
      echo "✅ Ready on main branch"
      echo ""

  - name: List GitHub Issues (if no issue_number provided)
    condition: "${{ !parameters.issue_number }}"
    run: |
      echo "📋 Fetching open issues from ${{ parameters.repo }}..."
      echo ""

      # List open issues with formatted output
      gh issue list \
        --repo "${{ parameters.repo }}" \
        --state open \
        --limit 20 \
        --json number,title,labels,assignees,createdAt \
        --template '{{range .}}{{tablerow (printf "#%v" .number) .title (pluck "name" .labels | join ", ") (pluck "login" .assignees | join ", ")}}{{end}}'

      echo ""

  - name: Prompt for Issue Selection
    condition: "${{ !parameters.issue_number }}"
    prompt: "Which issue would you like to work on? (Enter issue number)"
    store_as: selected_issue

  - name: Get Full Issue Details
    run: |
      # Determine which issue to fetch
      ISSUE_NUM="${{ parameters.issue_number }}"
      if [ -z "$ISSUE_NUM" ]; then
        ISSUE_NUM="${{ selected_issue }}"
      fi

      echo "📖 Fetching details for issue #$ISSUE_NUM..."
      echo ""

      # Get full issue details
      ISSUE_JSON=$(gh issue view "$ISSUE_NUM" \
        --repo "${{ parameters.repo }}" \
        --json number,title,body,labels,assignees,milestone)

      # Parse and display issue details
      ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
      ISSUE_BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
      ISSUE_LABELS=$(echo "$ISSUE_JSON" | jq -r '.labels | map(.name) | join(", ")')
      ISSUE_ASSIGNEES=$(echo "$ISSUE_JSON" | jq -r '.assignees | map(.login) | join(", ")')

      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "📌 Issue #$ISSUE_NUM: $ISSUE_TITLE"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""
      echo "📝 Description:"
      echo "$ISSUE_BODY"
      echo ""
      [ -n "$ISSUE_LABELS" ] && echo "🏷️  Labels: $ISSUE_LABELS"
      [ -n "$ISSUE_ASSIGNEES" ] && echo "👤 Assignees: $ISSUE_ASSIGNEES"
      echo ""

      # Store for next steps
      echo "$ISSUE_JSON" > /tmp/github_issue_$ISSUE_NUM.json
      echo "$ISSUE_NUM" > /tmp/github_issue_number.txt
      echo "$ISSUE_TITLE" > /tmp/github_issue_title.txt

  - name: Create Feature Branch
    run: |
      # Load issue data
      ISSUE_NUM=$(cat /tmp/github_issue_number.txt)
      ISSUE_TITLE=$(cat /tmp/github_issue_title.txt)

      # Generate branch slug (lowercase, hyphens, max 50 chars)
      SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/[^a-z0-9-]//g' | cut -c1-50)
      BRANCH_NAME="feature/issue-${ISSUE_NUM}-${SLUG}"

      echo "🌿 Creating feature branch: $BRANCH_NAME"
      git checkout -b "$BRANCH_NAME"

      echo "✅ Created and switched to: $BRANCH_NAME"
      echo ""

      # Store for later use
      echo "$BRANCH_NAME" > /tmp/github_branch_name.txt

  - name: Ask About Testing Preferences
    condition: "${{ parameters.tests == 'ask' }}"
    prompt: |
      🧪 What testing would you like to include?

      a) Unit tests only
      b) E2E/System tests only
      c) Both unit and E2E tests
      d) No tests (implementation only)

      Your choice (a/b/c/d):
    store_as: test_choice

  - name: Analyze Issue and Generate Plan
    run: |
      # Load issue data
      ISSUE_NUM=$(cat /tmp/github_issue_number.txt)
      ISSUE_TITLE=$(cat /tmp/github_issue_title.txt)
      ISSUE_JSON=$(cat /tmp/github_issue_$ISSUE_NUM.json)
      BRANCH_NAME=$(cat /tmp/github_branch_name.txt)

      ISSUE_BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
      ISSUE_LABELS=$(echo "$ISSUE_JSON" | jq -r '.labels | map(.name) | join(", ")')

      # Determine testing strategy
      TEST_PREF="${{ parameters.tests }}"
      if [ "$TEST_PREF" = "ask" ]; then
        case "${{ test_choice }}" in
          a) TEST_PREF="unit" ;;
          b) TEST_PREF="e2e" ;;
          c) TEST_PREF="both" ;;
          d) TEST_PREF="none" ;;
        esac
      fi

      # Search codebase for related files
      echo "🔍 Analyzing codebase for related files..."
      echo ""

      echo "📝 Generating implementation plan..."
      echo ""

      # Generate comprehensive implementation plan
      cat << EOF
# Implementation Plan: $ISSUE_TITLE

## 📋 Issue Details
- **Issue**: #$ISSUE_NUM
- **Labels**: $ISSUE_LABELS
- **Branch**: \`$BRANCH_NAME\`
- **Repository**: ${{ parameters.repo }}

## 🎯 Objective
$ISSUE_BODY

---

## 🏗️ Implementation Plan

### Phase 1: Database Schema (if needed)

**1. Create Migration**
- **File**: \`db/migrate/TIMESTAMP_add_feature.rb\`
- **Action**: Create
- **Changes**:
  \`\`\`ruby
  class AddFeature < ActiveRecord::Migration[8.0]
    def change
      create_table :table_name do |t|
        t.references :entity, null: false, foreign_key: true
        t.string :name, null: false
        t.jsonb :metadata, default: {}
        t.timestamps
      end

      add_index :table_name, [:entity_id, :name], unique: true
    end
  end
  \`\`\`
- **Reason**: {Explain why this schema is needed}

**2. Run Migration**
\`\`\`bash
docker-dev db db_action=migrate
\`\`\`

### Phase 2: Model Layer

**1. Create Model**
- **File**: \`app/models/model_name.rb\`
- **Action**: Create
- **Pattern**: Follow AMOS entity scoping pattern
- **Changes**:
  \`\`\`ruby
  class ModelName < ApplicationRecord
    belongs_to :entity

    validates :name, presence: true
    validates :name, uniqueness: { scope: :entity_id }

    scope :for_entity, ->(entity) { where(entity_id: entity.id) }
    scope :accessible_by, ->(user) { where(entity_id: user.entity_id) }
  end
  \`\`\`

### Phase 3: Service Layer

**1. Create Service**
- **File**: \`app/services/feature_service.rb\`
- **Action**: Create
- **Changes**:
  \`\`\`ruby
  class FeatureService
    def initialize(user, entity)
      @user = user
      @entity = entity
    end

    def create_feature(params)
      # Implementation
      ModelName.create!(
        entity: @entity,
        **params
      )
    end
  end
  \`\`\`

### Phase 4: Tool Integration (for Scout AI)

**1. Create Tool**
- **File**: \`app/services/tools/feature_tool.rb\`
- **Action**: Create
- **Pattern**: Extend BaseTool (auto-discovered by ToolCatalog)
- **Changes**:
  \`\`\`ruby
  module Tools
    class FeatureTool < BaseTool
      def self.definition
        {
          name: 'feature_tool',
          description: 'Tool description for Scout AI',
          parameters: {
            type: 'object',
            properties: {
              # Define parameters
            },
            required: []
          }
        }
      end

      def execute(args)
        # Use @user, @entity, @workflow_execution
        service = FeatureService.new(@user, @entity)
        result = service.create_feature(args)

        success_response(
          message: "Feature created!",
          data: { id: result.id }
        )
      end
    end
  end
  \`\`\`

### Phase 5: Controller & Routes

**1. Add Routes**
- **File**: \`config/routes.rb\`
- **Action**: Modify
- **Changes**: Add under \`app\` subdomain constraint
  \`\`\`ruby
  resources :features
  \`\`\`

**2. Create Controller**
- **File**: \`app/controllers/features_controller.rb\`
- **Action**: Create
- **Pattern**: Include EntityScoped concern
- **Changes**:
  \`\`\`ruby
  class FeaturesController < ApplicationController
    include EntityScoped
    before_action :authenticate_user!

    def index
      @features = ModelName.accessible_by(current_user)
    end

    def create
      service = FeatureService.new(current_user, current_entity)
      @feature = service.create_feature(feature_params)

      redirect_to @feature, notice: 'Feature created!'
    rescue => e
      render :new, alert: e.message
    end

    private

    def feature_params
      params.require(:feature).permit(:name, :description)
    end
  end
  \`\`\`

### Phase 6: Views (if needed)

**Files to create**:
- \`app/views/features/index.html.erb\`
- \`app/views/features/show.html.erb\`
- \`app/views/features/_form.html.erb\`

