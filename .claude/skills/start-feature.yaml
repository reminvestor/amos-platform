## 🔄 Implementation Steps

1. **Database Setup**
   \`\`\`bash
   # Create and run migration
   rails generate migration AddFeature
   # Edit migration file
   docker-dev db db_action=migrate
   \`\`\`

2. **Core Implementation**
   - Create model with validations
   - Create service with business logic
   - Create tool for Scout integration

3. **Web Layer**
   - Add routes
   - Create controller with entity scoping
   - Build views (if needed)

4. **Testing**
   - Write tests based on preference
   - Run: \`docker-dev test\`

5. **Manual Verification**
   - Follow manual testing checklist
   - Test in Scout chat
   - Verify entity isolation

6. **Commit & Push**
   \`\`\`bash
   git add .
   git commit -m "Implement #$ISSUE_NUM: $ISSUE_TITLE"
   git push -u origin $BRANCH_NAME
   \`\`\`

7. **Create Pull Request**
   \`\`\`bash
   gh pr create --repo "${{ parameters.repo }}" \\
     --title "Fix #$ISSUE_NUM: $ISSUE_TITLE" \\
     --body "Closes #$ISSUE_NUM

## Summary
{Brief description of changes}

## Testing
{How you tested this}

## Screenshots (if applicable)
{Add screenshots}"
   \`\`\`

