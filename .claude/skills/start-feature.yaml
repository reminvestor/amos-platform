# Start Feature - Interactive Backlog Workflow
# Lists Azure DevOps backlog items, creates feature branch, generates implementation plan

name: start-feature
description: Create feature branch from Azure DevOps backlog item with detailed implementation plan
version: "1.0"

parameters:
  project:
    description: "Azure DevOps project name"
    type: string
    default: "agent_marketing"

  work_item_id:
    description: "Specific work item ID (skip interactive selection)"
    type: string
    required: false

  tests:
    description: "Testing preference: unit, e2e, both, none, or ask"
    type: string
    default: "ask"

steps:
  - name: Prepare Git Repository
    run: |
      echo "🔍 Checking Git status..."
      current_branch=$(git branch --show-current)

      if [ "$current_branch" != "main" ]; then
        echo "⚠️  Currently on branch: $current_branch"
        echo "Switching to main..."
        git checkout main || exit 1
      fi

      echo "📥 Pulling latest from origin/main..."
      git pull origin main
      echo "✅ Ready on main branch"
      echo ""

  - name: List Backlog Items (if no work_item_id provided)
    condition: "${{ !parameters.work_item_id }}"
    mcp: azure_devops
    tool: list_work_items
    parameters:
      project: "${{ parameters.project }}"
      state: "New,Active"
      work_item_type: "User Story,Task,Bug"
      assigned_to: "@me"
      max_results: 20
    output_format: |
      📋 Available Work Items:

      {{#each items}}
      {{@index}}. [{{type}} #{{id}}] {{title}}
         Priority: {{fields.Priority}} | State: {{fields.State}} | Assigned: {{fields.AssignedTo.displayName}}
      {{/each}}

  - name: Prompt for Work Item Selection
    condition: "${{ !parameters.work_item_id }}"
    prompt: "Which work item would you like to work on? (Enter number or work item ID)"
    store_as: selected_item

  - name: Get Full Work Item Details
    mcp: azure_devops
    tool: get_work_item
    parameters:
      work_item_id: "${{ parameters.work_item_id || selected_item }}"
      project: "${{ parameters.project }}"
    store_as: work_item

  - name: Create Feature Branch
    run: |
      # Extract work item data
      WORK_ITEM_ID="${{ work_item.id }}"
      WORK_ITEM_TITLE="${{ work_item.fields.Title }}"

      # Generate branch slug (lowercase, hyphens, max 50 chars)
      SLUG=$(echo "$WORK_ITEM_TITLE" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/[^a-z0-9-]//g' | cut -c1-50)
      BRANCH_NAME="feature/work-item-${WORK_ITEM_ID}-${SLUG}"

      echo "🌿 Creating feature branch: $BRANCH_NAME"
      git checkout -b "$BRANCH_NAME"

      echo "✅ Created and switched to: $BRANCH_NAME"
      echo ""

      # Store for later use
      echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

  - name: Ask About Testing Preferences
    condition: "${{ parameters.tests == 'ask' }}"
    prompt: |
      🧪 What testing would you like to include?

      a) Unit tests only
      b) E2E/System tests only
      c) Both unit and E2E tests
      d) No tests (implementation only)

      Your choice (a/b/c/d):
    store_as: test_choice

  - name: Analyze Work Item and Generate Plan
    run: |
      # Parse work item details
      TITLE="${{ work_item.fields.Title }}"
      DESCRIPTION="${{ work_item.fields.Description }}"
      ACCEPTANCE_CRITERIA="${{ work_item.fields.AcceptanceCriteria }}"
      WORK_ITEM_TYPE="${{ work_item.fields.WorkItemType }}"
      PRIORITY="${{ work_item.fields.Priority }}"

      # Determine testing strategy
      TEST_PREF="${{ parameters.tests }}"
      if [ "$TEST_PREF" = "ask" ]; then
        case "${{ test_choice }}" in
          a) TEST_PREF="unit" ;;
          b) TEST_PREF="e2e" ;;
          c) TEST_PREF="both" ;;
          d) TEST_PREF="none" ;;
        esac
      fi

      # Search codebase for related files (example patterns)
      echo "🔍 Analyzing codebase for related files..."

      # Look for models, services, controllers mentioned in description
      # This is a simplified example - real implementation would be more sophisticated

      echo ""
      echo "📝 Generating implementation plan..."
      echo ""

      # Generate comprehensive implementation plan
      cat << EOF
# Implementation Plan: $TITLE

## 📋 Work Item Details
- **ID**: #${{ work_item.id }}
- **Type**: $WORK_ITEM_TYPE
- **Priority**: $PRIORITY
- **Branch**: \`$BRANCH_NAME\`

## 🎯 Objective
$DESCRIPTION

## ✅ Acceptance Criteria
$ACCEPTANCE_CRITERIA

---

## 🏗️ Implementation Plan

### Phase 1: Database Schema (if needed)

**1. Create Migration**
- **File**: \`db/migrate/TIMESTAMP_add_feature.rb\`
- **Action**: Create
- **Changes**:
  \`\`\`ruby
  class AddFeature < ActiveRecord::Migration[8.0]
    def change
      create_table :table_name do |t|
        t.references :entity, null: false, foreign_key: true
        t.string :name, null: false
        t.jsonb :metadata, default: {}
        t.timestamps
      end

      add_index :table_name, [:entity_id, :name], unique: true
    end
  end
  \`\`\`
- **Reason**: {Explain why this schema is needed}

**2. Run Migration**
\`\`\`bash
docker-dev db db_action=migrate
\`\`\`

### Phase 2: Model Layer

**1. Create Model**
- **File**: \`app/models/model_name.rb\`
- **Action**: Create
- **Pattern**: Follow AMOS entity scoping pattern
- **Changes**:
  \`\`\`ruby
  class ModelName < ApplicationRecord
    belongs_to :entity

    validates :name, presence: true
    validates :name, uniqueness: { scope: :entity_id }

    scope :for_entity, ->(entity) { where(entity_id: entity.id) }
    scope :accessible_by, ->(user) { where(entity_id: user.entity_id) }
  end
  \`\`\`

### Phase 3: Service Layer

**1. Create Service**
- **File**: \`app/services/feature_service.rb\`
- **Action**: Create
- **Changes**:
  \`\`\`ruby
  class FeatureService
    def initialize(user, entity)
      @user = user
      @entity = entity
    end

    def create_feature(params)
      # Implementation
      ModelName.create!(
        entity: @entity,
        **params
      )
    end
  end
  \`\`\`

### Phase 4: Tool Integration (for Scout AI)

**1. Create Tool**
- **File**: \`app/services/tools/feature_tool.rb\`
- **Action**: Create
- **Pattern**: Extend BaseTool (auto-discovered by ToolCatalog)
- **Changes**:
  \`\`\`ruby
  module Tools
    class FeatureTool < BaseTool
      def self.definition
        {
          name: 'feature_tool',
          description: 'Tool description for Scout AI',
          parameters: {
            type: 'object',
            properties: {
              # Define parameters
            },
            required: []
          }
        }
      end

      def execute(args)
        # Use @user, @entity, @workflow_execution
        service = FeatureService.new(@user, @entity)
        result = service.create_feature(args)

        success_response(
          message: "Feature created!",
          data: { id: result.id }
        )
      end
    end
  end
  \`\`\`

### Phase 5: Controller & Routes

**1. Add Routes**
- **File**: \`config/routes.rb\`
- **Action**: Modify
- **Changes**: Add under \`app\` subdomain constraint
  \`\`\`ruby
  resources :features
  \`\`\`

**2. Create Controller**
- **File**: \`app/controllers/features_controller.rb\`
- **Action**: Create
- **Pattern**: Include EntityScoped concern
- **Changes**:
  \`\`\`ruby
  class FeaturesController < ApplicationController
    include EntityScoped
    before_action :authenticate_user!

    def index
      @features = ModelName.accessible_by(current_user)
    end

    def create
      service = FeatureService.new(current_user, current_entity)
      @feature = service.create_feature(feature_params)

      redirect_to @feature, notice: 'Feature created!'
    rescue => e
      render :new, alert: e.message
    end

    private

    def feature_params
      params.require(:feature).permit(:name, :description)
    end
  end
  \`\`\`

### Phase 6: Views (if needed)

**Files to create**:
- \`app/views/features/index.html.erb\`
- \`app/views/features/show.html.erb\`
- \`app/views/features/_form.html.erb\`

