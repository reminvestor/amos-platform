## ⚠️ Important Considerations

**Entity Isolation**:
- ✅ All queries scoped to current_entity
- ✅ Entity foreign key with NOT NULL constraint
- ✅ EntityScoped concern in controller
- ✅ Accessible_by scope in model

**Database**:
- Migration needed? YES
- Indexes needed? YES (entity_id, uniqueness constraints)
- Background jobs needed? {ASSESS BASED ON WORK ITEM}

**API/Integration**:
- New Scout tool? YES
- New endpoints? YES (CRUD)
- Breaking changes? NO

**Edge Cases**:
- Empty state handling
- Validation failures
- Cross-entity access attempts
- Concurrent modifications

---

## 🔄 Implementation Steps

1. **Database Setup**
   \`\`\`bash
   # Create and run migration
   rails generate migration AddFeature
   # Edit migration file
   docker-dev db db_action=migrate
   \`\`\`

2. **Core Implementation**
   - Create model with validations
   - Create service with business logic
   - Create tool for Scout integration

3. **Web Layer**
   - Add routes
   - Create controller with entity scoping
   - Build views (if needed)

4. **Testing**
   - Write tests based on preference
   - Run: \`docker-dev test\`

5. **Manual Verification**
   - Follow manual testing checklist
   - Test in Scout chat
   - Verify entity isolation

6. **Commit & Push**
   \`\`\`bash
   git add .
   git commit -m "Implement #${{ work_item.id }}: $TITLE"
   git push -u origin $BRANCH_NAME
   \`\`\`

---

