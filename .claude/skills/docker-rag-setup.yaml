# Docker RAG Setup Skill
# Quickly setup and test RAG features in Docker

name: docker-rag-setup
description: Setup and test RAG (Docling + Pinecone) in Docker environment
version: "1.0"

parameters:
  action:
    description: "Action to perform: setup, verify, test, or health"
    type: string
    required: true
    enum:
      - setup       # Build and start Docker services
      - verify      # Check RAG dependencies are installed
      - test        # Run quick tests
      - health      # Check system health
      - seed        # Populate system RAG stores
      - logs        # Show logs
      - restart     # Restart services
      - down        # Stop all services
  service:
    description: "Specific service to target (web, db, redis, or all)"
    type: string
    default: "all"

steps:
  - name: Execute Docker Commands
    run: |
      case "${{ parameters.action }}" in

        setup)
          echo "🐳 Building and starting Docker services..."
          docker-compose down
          docker-compose build --no-cache
          docker-compose up -d
          echo "⏳ Waiting for services to be ready..."
          sleep 10
          docker-compose exec web rails db:prepare
          echo "✅ Docker services ready!"
          echo "📊 Run 'docker-rag-setup verify' to check RAG setup"
          ;;

        verify)
          echo "🔍 Verifying RAG setup in Docker..."
          echo ""
          echo "1. Checking Docling..."
          docker-compose exec web python3 -c "import docling; print('✅ Docling v' + docling.__version__ + ' installed')" || echo "❌ Docling not installed"
          echo ""
          echo "2. Checking environment variables..."
          docker-compose exec web bash -c '
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "❌ OPENAI_API_KEY not set"
            else
              echo "✅ OPENAI_API_KEY configured"
            fi

            if [ -z "$PINECONE_API_KEY" ]; then
              echo "❌ PINECONE_API_KEY not set"
            else
              echo "✅ PINECONE_API_KEY configured"
            fi
          '
          echo ""
          echo "3. Running Rails health check..."
          docker-compose exec web rails rag:health
          ;;

        test)
          echo "🧪 Running RAG tests..."
          echo ""
          echo "Test 1: Create test RAG store"
          docker-compose exec web rails runner '
            user = User.first || User.create!(
              email: "test@example.com",
              password: "password123",
              entity: Entity.first || Entity.create!(name: "Test Entity")
            )

            chunks = [{
              content: "AMOS is an AI-powered marketing automation platform with RAG capabilities.",
              metadata: { source: "test", page: 1 }
            }]

            service = RagStoreService.new
            result = service.create_rag_store(
              "test-docs",
              chunks,
              {
                entity: user.entity,
                user: user,
                store_type: "entity",
                name: "Test Documentation"
              }
            )

            puts "✅ Created RAG store: #{result[:rag_store].name}"
            puts "   ID: #{result[:rag_store].id}"
            puts "   Chunks: #{result[:rag_store].chunk_count}"
          '
          echo ""
          echo "Test 2: Query RAG store"
          docker-compose exec web rails runner '
            rag_store = RagStore.last
            service = RagStoreService.new

            result = service.query_rag_store(
              rag_store.id,
              "What is AMOS?",
              top_k: 3
            )

            puts "✅ Query successful!"
            puts "   Results: #{result[:results].length}"
            puts "   Top match score: #{result[:results].first[:score].round(2)}"
          '
          ;;

        health)
          echo "🏥 Checking system health..."
          docker-compose exec web rails rag:health
          ;;

        seed)
          echo "🌱 Seeding system RAG stores..."
          docker-compose exec web rails rag:populate_system
          ;;

        logs)
          if [ "${{ parameters.service }}" = "all" ]; then
            docker-compose logs -f
          else
            docker-compose logs -f ${{ parameters.service }}
          fi
          ;;

        restart)
          echo "🔄 Restarting Docker services..."
          if [ "${{ parameters.service }}" = "all" ]; then
            docker-compose restart
          else
            docker-compose restart ${{ parameters.service }}
          fi
          echo "✅ Services restarted"
          ;;

        down)
          echo "🛑 Stopping Docker services..."
          docker-compose down
          echo "✅ Services stopped"
          ;;

        *)
          echo "❌ Unknown action: ${{ parameters.action }}"
          echo "Valid actions: setup, verify, test, health, seed, logs, restart, down"
          exit 1
          ;;
      esac

examples:
  - description: "Initial setup - build and start all Docker services"
    command: "Use docker-rag-setup with action=setup"

  - description: "Verify RAG dependencies and configuration"
    command: "Use docker-rag-setup with action=verify"

  - description: "Run quick RAG tests"
    command: "Use docker-rag-setup with action=test"

  - description: "Check system health"
    command: "Use docker-rag-setup with action=health"

  - description: "Populate system knowledge bases"
    command: "Use docker-rag-setup with action=seed"

  - description: "View Rails logs"
    command: "Use docker-rag-setup with action=logs and service=web"

  - description: "Restart all services"
    command: "Use docker-rag-setup with action=restart"

  - description: "Stop all services"
    command: "Use docker-rag-setup with action=down"
