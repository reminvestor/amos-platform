# DB Snapshot - Save and restore database state
# Useful for testing workflows and preserving data states

name: db-snapshot
description: Save and restore database snapshots for testing and development
version: "1.0"

parameters:
  action:
    description: "Action: save, restore, list, or delete"
    type: string
    default: "save"

  name:
    description: "Snapshot name (defaults to timestamp)"
    type: string
    required: false

steps:
  - name: List Snapshots
    condition: "${{ parameters.action == 'list' }}"
    run: |
      echo "📋 Available database snapshots:"
      echo ""

      SNAPSHOT_DIR=".db_snapshots"

      if [ ! -d "$SNAPSHOT_DIR" ]; then
        echo "No snapshots found"
        exit 0
      fi

      if [ -z "$(ls -A $SNAPSHOT_DIR)" ]; then
        echo "No snapshots found"
      else
        for snapshot in $SNAPSHOT_DIR/*.sql; do
          if [ -f "$snapshot" ]; then
            FILENAME=$(basename "$snapshot" .sql)
            SIZE=$(du -h "$snapshot" | cut -f1)
            MODIFIED=$(stat -f "%Sm" -t "%Y-%m-%d %H:%M" "$snapshot" 2>/dev/null || stat -c "%y" "$snapshot" 2>/dev/null | cut -d'.' -f1)

            echo "  📸 $FILENAME"
            echo "     Size: $SIZE"
            echo "     Created: $MODIFIED"
            echo ""
          fi
        done
      fi

      echo "Usage:"
      echo "  Save: Use db-snapshot with action=save name=my_snapshot"
      echo "  Restore: Use db-snapshot with action=restore name=my_snapshot"
      echo "  Delete: Use db-snapshot with action=delete name=my_snapshot"

  - name: Save Snapshot
    condition: "${{ parameters.action == 'save' }}"
    run: |
      SNAPSHOT_DIR=".db_snapshots"
      mkdir -p "$SNAPSHOT_DIR"

      # Generate snapshot name
      if [ -n "${{ parameters.name }}" ]; then
        SNAPSHOT_NAME="${{ parameters.name }}"
      else
        SNAPSHOT_NAME="snapshot_$(date +%Y%m%d_%H%M%S)"
      fi

      SNAPSHOT_FILE="$SNAPSHOT_DIR/${SNAPSHOT_NAME}.sql"

      echo "📸 Saving database snapshot: $SNAPSHOT_NAME"
      echo ""

      # Get database name from Rails
      DB_NAME=$(docker-compose run --rm web rails runner "puts ActiveRecord::Base.connection_db_config.database" 2>/dev/null | tail -1)

      echo "Database: $DB_NAME"
      echo "File: $SNAPSHOT_FILE"
      echo ""

      # Create dump using pg_dump via docker
      docker-compose exec -T db pg_dump -U postgres "$DB_NAME" > "$SNAPSHOT_FILE"

      if [ $? -eq 0 ]; then
        SIZE=$(du -h "$SNAPSHOT_FILE" | cut -f1)
        echo "✅ Snapshot saved successfully!"
        echo "   Size: $SIZE"
        echo "   Location: $SNAPSHOT_FILE"
        echo ""
        echo "Restore with:"
        echo "  Use db-snapshot with action=restore name=$SNAPSHOT_NAME"
      else
        echo "❌ Failed to create snapshot"
        rm -f "$SNAPSHOT_FILE"
        exit 1
      fi

  - name: Restore Snapshot
    condition: "${{ parameters.action == 'restore' }}"
    run: |
      if [ -z "${{ parameters.name }}" ]; then
        echo "❌ Snapshot name required for restore"
        echo ""
        echo "Available snapshots:"
        ls -1 .db_snapshots/*.sql 2>/dev/null | sed 's|.db_snapshots/||' | sed 's|.sql||' | sed 's|^|  - |'
        exit 1
      fi

      SNAPSHOT_DIR=".db_snapshots"
      SNAPSHOT_NAME="${{ parameters.name }}"
      SNAPSHOT_FILE="$SNAPSHOT_DIR/${SNAPSHOT_NAME}.sql"

      if [ ! -f "$SNAPSHOT_FILE" ]; then
        echo "❌ Snapshot not found: $SNAPSHOT_NAME"
        echo ""
        echo "Available snapshots:"
        ls -1 $SNAPSHOT_DIR/*.sql 2>/dev/null | sed 's|.db_snapshots/||' | sed 's|.sql||' | sed 's|^|  - |'
        exit 1
      fi

      echo "⚠️  WARNING: This will replace your current database!"
      echo ""
      echo "Snapshot: $SNAPSHOT_NAME"
      echo "File: $SNAPSHOT_FILE"
      echo ""
    prompt: "Continue with restore? (yes/no)"
    store_as: confirm_restore

  - name: Execute Restore
    condition: "${{ parameters.action == 'restore' && confirm_restore == 'yes' }}"
    run: |
      SNAPSHOT_DIR=".db_snapshots"
      SNAPSHOT_NAME="${{ parameters.name }}"
      SNAPSHOT_FILE="$SNAPSHOT_DIR/${SNAPSHOT_NAME}.sql"

      echo "🔄 Restoring database from snapshot..."
      echo ""

      # Get database name
      DB_NAME=$(docker-compose run --rm web rails runner "puts ActiveRecord::Base.connection_db_config.database" 2>/dev/null | tail -1)

      echo "1. Dropping existing database..."
      docker-compose run --rm web rails db:drop

      echo "2. Creating fresh database..."
      docker-compose run --rm web rails db:create

      echo "3. Restoring from snapshot..."
      cat "$SNAPSHOT_FILE" | docker-compose exec -T db psql -U postgres "$DB_NAME"

      if [ $? -eq 0 ]; then
        echo ""
        echo "✅ Database restored successfully!"
        echo ""
        echo "Snapshot: $SNAPSHOT_NAME"
      else
        echo ""
        echo "❌ Failed to restore snapshot"
        exit 1
      fi

  - name: Delete Snapshot
    condition: "${{ parameters.action == 'delete' }}"
    run: |
      if [ -z "${{ parameters.name }}" ]; then
        echo "❌ Snapshot name required for delete"
        echo ""
        echo "Available snapshots:"
        ls -1 .db_snapshots/*.sql 2>/dev/null | sed 's|.db_snapshots/||' | sed 's|.sql||' | sed 's|^|  - |'
        exit 1
      fi

      SNAPSHOT_DIR=".db_snapshots"
      SNAPSHOT_NAME="${{ parameters.name }}"
      SNAPSHOT_FILE="$SNAPSHOT_DIR/${SNAPSHOT_NAME}.sql"

      if [ ! -f "$SNAPSHOT_FILE" ]; then
        echo "❌ Snapshot not found: $SNAPSHOT_NAME"
        exit 1
      fi

      SIZE=$(du -h "$SNAPSHOT_FILE" | cut -f1)

      echo "🗑️  Delete snapshot:"
      echo "   Name: $SNAPSHOT_NAME"
      echo "   Size: $SIZE"
      echo ""
    prompt: "Confirm deletion? (yes/no)"
    store_as: confirm_delete

  - name: Execute Delete
    condition: "${{ parameters.action == 'delete' && confirm_delete == 'yes' }}"
    run: |
      SNAPSHOT_DIR=".db_snapshots"
      SNAPSHOT_NAME="${{ parameters.name }}"
      SNAPSHOT_FILE="$SNAPSHOT_DIR/${SNAPSHOT_NAME}.sql"

      rm "$SNAPSHOT_FILE"

      echo "✅ Snapshot deleted: $SNAPSHOT_NAME"

examples:
  - description: "Save current database state"
    command: "Use db-snapshot with action=save name=before_migration"

  - description: "Save with auto-generated name"
    command: "Use db-snapshot with action=save"

  - description: "List all snapshots"
    command: "Use db-snapshot with action=list"

  - description: "Restore from snapshot"
    command: "Use db-snapshot with action=restore name=before_migration"

  - description: "Delete snapshot"
    command: "Use db-snapshot with action=delete name=old_snapshot"
