# Fix RuboCop - Auto-fix linting issues
# Runs RuboCop with safe auto-correct and commits changes

name: fix-rubocop
description: Auto-fix RuboCop linting issues with safe auto-correct
version: "1.0"

parameters:
  path:
    description: "Specific file or directory to fix (defaults to all)"
    type: string
    required: false

  unsafe:
    description: "Use unsafe auto-correct (true/false)"
    type: string
    default: "false"

  commit:
    description: "Commit changes after fixing (true/false)"
    type: string
    default: "true"

steps:
  - name: Run RuboCop Check
    run: |
      echo "🔍 Checking RuboCop offenses..."
      echo ""

      TARGET="${{ parameters.path }}"
      if [ -z "$TARGET" ]; then
        TARGET="."
      fi

      # Run check to see current state
      if docker-compose run --rm web bundle exec rubocop "$TARGET"; then
        echo "✅ No RuboCop offenses found!"
        exit 0
      else
        echo ""
        echo "Found offenses. Proceeding with auto-correct..."
      fi

  - name: Run Auto-Correct
    run: |
      TARGET="${{ parameters.path }}"
      if [ -z "$TARGET" ]; then
        TARGET="."
      fi

      if [ "${{ parameters.unsafe }}" = "true" ]; then
        echo "⚠️  Running UNSAFE auto-correct..."
        echo "This may change code behavior!"
        echo ""
        docker-compose run --rm web bundle exec rubocop -A "$TARGET"
      else
        echo "🔧 Running safe auto-correct..."
        echo ""
        docker-compose run --rm web bundle exec rubocop -a "$TARGET"
      fi

      # Check if there are remaining offenses
      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "Final RuboCop check..."
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""

      if docker-compose run --rm web bundle exec rubocop "$TARGET"; then
        echo "✅ All auto-correctable offenses fixed!"
        echo "RESULT=success" > /tmp/rubocop_result.txt
      else
        echo "⚠️  Some offenses require manual fixing"
        echo "RESULT=partial" > /tmp/rubocop_result.txt
      fi

  - name: Show Changes
    run: |
      echo ""
      echo "📝 Changes made:"
      echo ""

      if git diff --quiet; then
        echo "No changes made (already compliant)"
        exit 0
      fi

      # Show diff stats
      git diff --stat

      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  - name: Commit Changes
    condition: "${{ parameters.commit == 'true' }}"
    run: |
      if git diff --quiet; then
        echo "No changes to commit"
        exit 0
      fi

      echo "📝 Committing RuboCop fixes..."
      echo ""

      git add .
      git commit -m "Fix RuboCop offenses

Auto-corrected linting issues

🤖 Generated with Claude Code"

      echo "✅ Changes committed!"
      echo ""

      # Show commit
      git log -1 --oneline

      echo ""
      echo "Push changes with: git push"

  - name: Summary
    run: |
      RESULT=$(cat /tmp/rubocop_result.txt 2>/dev/null || echo "RESULT=unknown")

      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "📊 RuboCop Fix Summary"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""

      if echo "$RESULT" | grep -q "success"; then
        echo "✅ Status: All offenses fixed!"
        echo ""
        echo "Your code is now RuboCop compliant."
      else
        echo "⚠️  Status: Partially fixed"
        echo ""
        echo "Some offenses require manual attention:"
        echo ""
        docker-compose run --rm web bundle exec rubocop --format simple
        echo ""
        echo "Common manual fixes:"
        echo "  - Complex code style issues"
        echo "  - Metrics violations (method/class length)"
        echo "  - Security concerns"
        echo "  - Disabled cops in specific files"
      fi

      # Cleanup
      rm -f /tmp/rubocop_result.txt

examples:
  - description: "Fix all RuboCop offenses (safe mode)"
    command: "Use fix-rubocop"

  - description: "Fix specific file"
    command: "Use fix-rubocop with path=app/models/campaign.rb"

  - description: "Fix specific directory"
    command: "Use fix-rubocop with path=app/services/tools"

  - description: "Fix with unsafe auto-correct"
    command: "Use fix-rubocop with unsafe=true"

  - description: "Fix without committing"
    command: "Use fix-rubocop with commit=false"
