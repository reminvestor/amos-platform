# Run Tests - Smart test runner with multiple modes
# Supports affected tests, watch mode, coverage, and selective test execution

name: run-tests
description: Smart test runner with watch mode, coverage, and selective execution
version: "1.0"

parameters:
  mode:
    description: "Test mode: all, affected, file, watch, or ask"
    type: string
    default: "ask"

  path:
    description: "Specific test file or directory to run"
    type: string
    required: false

  coverage:
    description: "Generate coverage report (true/false)"
    type: string
    default: "false"

steps:
  - name: Determine Test Mode
    condition: "${{ parameters.mode == 'ask' }}"
    run: |
      echo "🧪 Test Runner"
      echo ""
      echo "Select test mode:"
      echo "  1) all - Run all tests in the suite"
      echo "  2) affected - Run only tests affected by git changes"
      echo "  3) file - Run a specific test file"
      echo "  4) watch - Watch mode (re-run tests on file changes)"
      echo "  5) coverage - Run all tests with coverage report"
      echo ""
    prompt: "Enter mode name or number (all/affected/file/watch/coverage or 1-5):"
    store_as: test_mode_choice

  - name: Get Test File (if specific file mode)
    condition: "${{ (test_mode_choice == 'file' || test_mode_choice == '3' || test_mode_choice == 'c') && !parameters.path }}"
    run: |
      echo "📁 Available test files:"
      echo ""
      find test -name "*_test.rb" -type f | head -20
      echo ""
    prompt: "Enter test file path (e.g., test/models/campaign_test.rb):"
    store_as: test_file_path

  - name: Run All Tests
    condition: "${{ parameters.mode == 'all' || test_mode_choice == 'all' || test_mode_choice == '1' || test_mode_choice == 'a' }}"
    run: |
      echo "🧪 Running all tests..."
      echo ""

      if [ "${{ parameters.coverage }}" = "true" ] || [ "${{ test_mode_choice }}" = "coverage" ] || [ "${{ test_mode_choice }}" = "5" ] || [ "${{ test_mode_choice }}" = "e" ]; then
        echo "📊 Coverage enabled"
        COVERAGE=true docker-compose run --rm web rails test
      else
        docker-compose run --rm web rails test
      fi

      echo ""
      echo "✅ Test run complete!"

  - name: Find Affected Tests
    condition: "${{ parameters.mode == 'affected' || test_mode_choice == 'affected' || test_mode_choice == '2' || test_mode_choice == 'b' }}"
    run: |
      echo "🔍 Finding affected tests based on git changes..."
      echo ""

      # Get changed files
      CHANGED_FILES=$(git diff --name-only main...HEAD 2>/dev/null || git diff --name-only HEAD~1)

      if [ -z "$CHANGED_FILES" ]; then
        echo "⚠️  No changes detected. Running all tests..."
        docker-compose run --rm web rails test
        exit 0
      fi

      echo "Changed files:"
      echo "$CHANGED_FILES"
      echo ""

      # Map changed files to test files
      TEST_FILES=""

      echo "$CHANGED_FILES" | while read file; do
        case "$file" in
          app/models/*.rb)
            model_name=$(basename "$file" .rb)
            test_file="test/models/${model_name}_test.rb"
            [ -f "$test_file" ] && echo "$test_file"
            ;;
          app/controllers/*.rb)
            controller_name=$(basename "$file" .rb)
            test_file="test/controllers/${controller_name}_test.rb"
            [ -f "$test_file" ] && echo "$test_file"
            ;;
          app/services/*.rb)
            service_name=$(basename "$file" .rb)
            test_file="test/services/${service_name}_test.rb"
            [ -f "$test_file" ] && echo "$test_file"
            ;;
          app/services/tools/*.rb)
            tool_name=$(basename "$file" .rb)
            test_file="test/services/tools/${tool_name}_test.rb"
            [ -f "$test_file" ] && echo "$test_file"
            ;;
          *)
            ;;
        esac
      done > /tmp/affected_tests.txt

      AFFECTED=$(cat /tmp/affected_tests.txt | sort | uniq)

      if [ -z "$AFFECTED" ]; then
        echo "⚠️  No matching test files found. Running all tests..."
        docker-compose run --rm web rails test
      else
        echo "🎯 Running affected tests:"
        echo "$AFFECTED"
        echo ""

        # Run each test file
        echo "$AFFECTED" | while read test_file; do
          echo "Running: $test_file"
          docker-compose run --rm web rails test "$test_file"
        done
      fi

      rm -f /tmp/affected_tests.txt

      echo ""
      echo "✅ Affected tests complete!"

  - name: Run Specific Test File
    condition: "${{ parameters.mode == 'file' || test_mode_choice == 'file' || test_mode_choice == '3' || test_mode_choice == 'c' }}"
    run: |
      # Determine which file to run
      if [ -n "${{ parameters.path }}" ]; then
        TEST_PATH="${{ parameters.path }}"
      else
        TEST_PATH="${{ test_file_path }}"
      fi

      if [ ! -f "$TEST_PATH" ]; then
        echo "❌ Test file not found: $TEST_PATH"
        exit 1
      fi

      echo "🧪 Running: $TEST_PATH"
      echo ""

      docker-compose run --rm web rails test "$TEST_PATH"

      echo ""
      echo "✅ Test complete!"

  - name: Watch Mode
    condition: "${{ parameters.mode == 'watch' || test_mode_choice == 'watch' || test_mode_choice == '4' || test_mode_choice == 'd' }}"
    run: |
      echo "👀 Watch mode - Re-running tests on file changes..."
      echo ""
      echo "Press Ctrl+C to stop"
      echo ""

      # Use guard or simple watch loop
      if [ -f "Guardfile" ]; then
        docker-compose run --rm web bundle exec guard
      else
        echo "⚠️  Guardfile not found. Using simple watch mode..."
        echo ""

        while true; do
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Running tests... ($(date))"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          docker-compose run --rm web rails test

          echo ""
          echo "Waiting for changes..."
          # Simple file watch (requires fswatch or inotifywait)
          if command -v fswatch >/dev/null 2>&1; then
            fswatch -1 -r app/ test/ lib/
          else
            echo "Install 'fswatch' for better watch mode"
            sleep 5
          fi
        done
      fi

  - name: Run with Coverage
    condition: "${{ test_mode_choice == 'coverage' || test_mode_choice == '5' || test_mode_choice == 'e' }}"
    run: |
      echo "📊 Running tests with coverage report..."
      echo ""

      COVERAGE=true docker-compose run --rm web rails test

      echo ""
      echo "✅ Tests complete!"
      echo ""
      echo "📈 Coverage report generated:"
      echo "   coverage/index.html"
      echo ""
      echo "To view:"
      echo "   open coverage/index.html"

examples:
  - description: "Interactive test mode selection"
    command: "Use run-tests"

  - description: "Run all tests"
    command: "Use run-tests with mode=all"

  - description: "Run affected tests only"
    command: "Use run-tests with mode=affected"

  - description: "Run specific test file"
    command: "Use run-tests with mode=file path=test/models/campaign_test.rb"

  - description: "Run tests with coverage"
    command: "Use run-tests with mode=all coverage=true"

  - description: "Watch mode (re-run on changes)"
    command: "Use run-tests with mode=watch"
