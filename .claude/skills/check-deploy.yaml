# Check Deploy - Pre-deployment checklist
# Verifies migrations, env vars, breaking changes before deployment

name: check-deploy
description: Run pre-deployment checklist (migrations, env vars, breaking changes)
version: "1.0"

parameters:
  environment:
    description: "Target environment: staging, production, or both"
    type: string
    default: "production"

  fix:
    description: "Auto-fix issues when possible (true/false)"
    type: string
    default: "false"

steps:
  - name: Initialize Deployment Check
    run: |
      echo "🚀 Pre-Deployment Checklist"
      echo ""
      echo "Environment: ${{ parameters.environment }}"
      echo "Branch: $(git branch --show-current)"
      echo "Commit: $(git log -1 --oneline)"
      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""

      # Initialize issue counter
      echo "0" > /tmp/deploy_issues.txt

  - name: Check Git Status
    run: |
      echo "1️⃣ Checking Git status..."
      echo ""

      # Ensure we're on main or a release branch
      CURRENT_BRANCH=$(git branch --show-current)

      if [ "$CURRENT_BRANCH" != "main" ] && ! echo "$CURRENT_BRANCH" | grep -q "^release/"; then
        echo "  ⚠️  Not on main or release branch: $CURRENT_BRANCH"
        echo "     Consider merging to main first"
        ISSUES=$(cat /tmp/deploy_issues.txt)
        echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
      else
        echo "  ✅ On deployment branch: $CURRENT_BRANCH"
      fi

      # Check for uncommitted changes
      if ! git diff --quiet || ! git diff --cached --quiet; then
        echo "  ❌ Uncommitted changes detected"
        git status --short
        ISSUES=$(cat /tmp/deploy_issues.txt)
        echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
      else
        echo "  ✅ No uncommitted changes"
      fi

      # Check if branch is up to date with origin
      git fetch origin
      LOCAL=$(git rev-parse HEAD)
      REMOTE=$(git rev-parse origin/$(git branch --show-current) 2>/dev/null || echo "")

      if [ -n "$REMOTE" ] && [ "$LOCAL" != "$REMOTE" ]; then
        echo "  ⚠️  Branch is not in sync with origin"
        echo "     Run: git pull or git push"
        ISSUES=$(cat /tmp/deploy_issues.txt)
        echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
      else
        echo "  ✅ Branch is in sync with origin"
      fi

      echo ""

  - name: Check for Pending Migrations
    run: |
      echo "2️⃣ Checking database migrations..."
      echo ""

      # List new migrations since last deploy
      NEW_MIGRATIONS=$(find db/migrate -name "*.rb" -type f -newer .last_deploy 2>/dev/null || find db/migrate -name "*.rb" -type f | tail -5)

      if [ -n "$NEW_MIGRATIONS" ]; then
        echo "  📋 Recent migrations found:"
        echo "$NEW_MIGRATIONS" | while read migration; do
          echo "     - $(basename $migration)"
        done
        echo ""
        echo "  ⚠️  Remember to run migrations after deployment"
        echo "     Command: rails db:migrate"
      else
        echo "  ✅ No new migrations detected"
      fi

      # Check for reversible migrations
      echo ""
      echo "  Checking migration safety..."
      UNSAFE=$(grep -l "change_column\|remove_column\|drop_table" db/migrate/*.rb 2>/dev/null || true)

      if [ -n "$UNSAFE" ]; then
        echo "  ⚠️  Potentially unsafe migrations detected:"
        echo "$UNSAFE" | while read file; do
          echo "     - $(basename $file)"
        done
        echo "     Review carefully before deploying!"
      else
        echo "  ✅ No unsafe migrations detected"
      fi

      echo ""

  - name: Check Environment Variables
    run: |
      echo "3️⃣ Checking environment variables..."
      echo ""

      # Get required env vars from code
      REQUIRED_VARS="AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DATABASE_URL REDIS_URL SECRET_KEY_BASE"

      # Check .env.example for new variables
      if [ -f .env.example ]; then
        NEW_VARS=$(grep "^[A-Z_]*=" .env.example | cut -d'=' -f1)

        echo "  Required environment variables:"
        echo "$NEW_VARS" | while read var; do
          if [ -n "$var" ]; then
            echo "    - $var"
          fi
        done
      fi

      echo ""
      echo "  ⚠️  Verify these are set in deployment environment:"
      echo "     - Check AWS Secrets Manager (production)"
      echo "     - Check .env file (staging)"
      echo ""

  - name: Check for Breaking Changes
    run: |
      echo "4️⃣ Checking for breaking changes..."
      echo ""

      # Look for version bumps
      if [ -f CHANGELOG.md ]; then
        BREAKING=$(grep -i "BREAKING\|breaking change" CHANGELOG.md | head -5 || true)

        if [ -n "$BREAKING" ]; then
          echo "  ⚠️  Breaking changes detected in CHANGELOG:"
          echo "$BREAKING" | sed 's/^/     /'
          echo ""
          ISSUES=$(cat /tmp/deploy_issues.txt)
          echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
        else
          echo "  ✅ No breaking changes in CHANGELOG"
        fi
      fi

      # Check for removed routes
      REMOVED_ROUTES=$(git diff origin/main..HEAD config/routes.rb | grep "^-" | grep -v "^---" || true)

      if [ -n "$REMOVED_ROUTES" ]; then
        echo "  ⚠️  Routes removed in this deployment:"
        echo "$REMOVED_ROUTES" | sed 's/^/     /'
        echo ""
      fi

      # Check for removed models/controllers
      DELETED_FILES=$(git diff origin/main..HEAD --diff-filter=D --name-only | grep -E "app/(models|controllers)/" || true)

      if [ -n "$DELETED_FILES" ]; then
        echo "  ⚠️  Files deleted in this deployment:"
        echo "$DELETED_FILES" | sed 's/^/     /'
        echo ""
        ISSUES=$(cat /tmp/deploy_issues.txt)
        echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
      fi

      echo ""

  - name: Run Test Suite
    run: |
      echo "5️⃣ Running test suite..."
      echo ""

      if docker-compose run --rm web rails test; then
        echo "  ✅ All tests passing"
      else
        echo "  ❌ Test failures detected"
        echo "     Fix tests before deploying!"
        ISSUES=$(cat /tmp/deploy_issues.txt)
        echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
      fi

      echo ""

  - name: Check RuboCop
    run: |
      echo "6️⃣ Running RuboCop..."
      echo ""

      if docker-compose run --rm web bundle exec rubocop --format simple; then
        echo "  ✅ No RuboCop offenses"
      else
        echo "  ⚠️  RuboCop offenses found"

        if [ "${{ parameters.fix }}" = "true" ]; then
          echo "  🔧 Auto-fixing..."
          docker-compose run --rm web bundle exec rubocop -a
        else
          echo "     Run with fix=true to auto-correct"
        fi
      fi

      echo ""

  - name: Check Dependencies
    run: |
      echo "7️⃣ Checking dependencies..."
      echo ""

      # Check for security vulnerabilities
      if docker-compose run --rm web bundle exec bundler-audit check 2>/dev/null; then
        echo "  ✅ No known vulnerabilities"
      else
        echo "  ❌ Security vulnerabilities found!"
        echo "     Review and update dependencies"
        ISSUES=$(cat /tmp/deploy_issues.txt)
        echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
      fi

      # Check for outdated dependencies
      OUTDATED=$(docker-compose run --rm web bundle outdated --strict 2>/dev/null | grep -c "newer version" || echo "0")

      if [ "$OUTDATED" = "0" ]; then
        echo "  ✅ Dependencies up to date"
      else
        echo "  ⚠️  $OUTDATED outdated dependencies"
        echo "     Consider updating before deploy"
      fi

      echo ""

  - name: Check Asset Compilation
    run: |
      echo "8️⃣ Checking asset compilation..."
      echo ""

      # Try to precompile assets
      echo "  Testing asset precompilation..."

      if docker-compose run --rm web rails assets:precompile RAILS_ENV=production 2>&1 | grep -q "error"; then
        echo "  ❌ Asset compilation failed"
        ISSUES=$(cat /tmp/deploy_issues.txt)
        echo $((ISSUES + 1)) > /tmp/deploy_issues.txt
      else
        echo "  ✅ Assets compile successfully"

        # Cleanup
        docker-compose run --rm web rails assets:clobber
      fi

      echo ""

  - name: Generate Deployment Summary
    run: |
      ISSUES=$(cat /tmp/deploy_issues.txt)

      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "📊 Deployment Readiness Report"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""

      if [ "$ISSUES" = "0" ]; then
        echo "✅ ALL CHECKS PASSED - READY TO DEPLOY"
        echo ""
        echo "Status: 🟢 READY"
      elif [ "$ISSUES" -le "2" ]; then
        echo "⚠️  $ISSUES ISSUE(S) FOUND - REVIEW BEFORE DEPLOYING"
        echo ""
        echo "Status: 🟡 CAUTION"
      else
        echo "❌ $ISSUES ISSUE(S) FOUND - DO NOT DEPLOY"
        echo ""
        echo "Status: 🔴 NOT READY"
      fi

      echo ""
      echo "Deployment Checklist:"
      echo "  - [ ] All tests passing"
      echo "  - [ ] No RuboCop offenses"
      echo "  - [ ] No security vulnerabilities"
      echo "  - [ ] Environment variables verified"
      echo "  - [ ] Migration plan prepared"
      echo "  - [ ] Breaking changes documented"
      echo "  - [ ] Rollback plan ready"
      echo ""

      if [ -f db/migrate/*.rb ]; then
        echo "Post-Deployment Steps:"
        echo "  1. Run migrations: rails db:migrate"
        echo "  2. Restart app servers"
        echo "  3. Verify health checks"
        echo "  4. Monitor error logs"
        echo "  5. Test critical user flows"
        echo ""
      fi

      echo "Emergency Rollback:"
      echo "  git revert $(git log -1 --format='%H')"
      echo "  git push origin $(git branch --show-current)"
      echo ""

      # Cleanup
      rm -f /tmp/deploy_issues.txt

examples:
  - description: "Check production deployment readiness"
    command: "Use check-deploy"

  - description: "Check staging deployment"
    command: "Use check-deploy with environment=staging"

  - description: "Check with auto-fix"
    command: "Use check-deploy with fix=true"
