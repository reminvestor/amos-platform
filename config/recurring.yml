# RAG System Monitoring & Maintenance Jobs
production:
  # Daily metrics collection - comprehensive system statistics
  rag_daily_metrics:
    class: Rag::MetricsJob
    queue: maintenance
    schedule: at 2am every day

  # Health checks every 15 minutes - ensure all systems operational
  rag_health_check:
    class: Rag::HealthCheckJob
    queue: maintenance
    schedule: every 15 minutes

  # Cache warming every 6 hours - pre-compute popular queries
  rag_cache_warming:
    class: Rag::WarmCacheJob
    queue: maintenance
    schedule: every 6 hours

  # Weekly archival - move old documents to Glacier storage
  rag_weekly_archival:
    class: Rag::ArchiveOldDocumentsJob
    queue: maintenance
    schedule: at 3am every sunday
  
  # Clean up temporary uploads every hour
  cleanup_temporary_uploads:
    class: CleanupTemporaryUploadsJob
    queue: maintenance
    schedule: every hour

  # ========================================
  # Agent Collaboration System Jobs
  # ========================================
  
  # Hourly energy regeneration for all agents
  agent_energy_regeneration:
    class: EnergyRegenerationJob
    queue: agents
    schedule: every hour
  
  # Weekly capability recalibration - update specialization detection
  agent_capability_recalibration:
    class: AgentCapabilityRecalibrationJob
    queue: agents
    schedule: at 4am every monday
  
  # Daily decision boundary updates - learn from recent outcomes
  agent_decision_boundary_update:
    class: AgentDecisionBoundaryUpdateJob
    queue: agents
    schedule: at 5am every day

  # ========================================
  # Benchmark Tracking Jobs
  # ========================================
  
  # Weekly benchmark run - track performance over time
  scheduled_benchmark:
    class: ScheduledBenchmarkJob
    queue: agents
    schedule: at 6am every monday
  
  # Daily quick benchmark (smaller sample)
  daily_benchmark:
    class: ScheduledBenchmarkJob
    queue: agents
    schedule: at 6am every day
    args:
      - null
      - sample_size: 1

  # ========================================
  # Agent Lightning Jobs
  # ========================================
  
  # Hourly auto-rollback check - monitors optimization performance
  agent_lightning_auto_rollback:
    class: AgentLightningAutoRollbackJob
    queue: agent_lightning
    schedule: every hour

  # ========================================
  # Scheduled Agent Tasks
  # ========================================
  
  # Check for due scheduled tasks every minute
  scheduled_task_dispatcher:
    class: ScheduledTaskDispatcherJob
    queue: default
    schedule: every minute
  
  # Refresh auto-refresh visualizations
  visualization_refresh:
    class: RefreshVisualizationsJob
    queue: maintenance
    schedule: every 15 minutes

  # ========================================
  # Workflow Automation Jobs
  # ========================================
  
  # Fire scheduled workflow triggers every minute
  workflow_scheduled_triggers:
    class: Workflows::ScheduledTriggerJob
    queue: workflows
    schedule: every minute

  # ========================================
  # Billing Jobs
  # ========================================
  
  # Check for accounts needing auto-replenishment every 5 minutes
  billing_auto_replenish_check:
    class: BillingAutoReplenishCheckJob
    queue: billing
    schedule: every 5 minutes

  # ========================================
  # Token Economy Jobs
  # ========================================
  
  # Daily token decay - apply decay to all stakes
  token_daily_decay:
    class: TokenDecayJob
    queue: billing
    schedule: at 1am every day

  # ========================================
  # AMOS Thinking Time Jobs - Autonomous Bounty Generation
  # ========================================
  
  # Nightly thinking time - AMOS reflects and creates bounties
  amos_thinking_time:
    class: AmosThinkingTimeJob
    queue: living_platform
    schedule: at 2am every day
  
  # Weekly deep reflection - more comprehensive analysis
  amos_weekly_reflection:
    class: AmosThinkingTimeJob
    queue: living_platform
    schedule: at 3am every sunday
    args:
      - entity_id: null

  # ========================================
  # Tool Embeddings Jobs
  # ========================================
  
  # Daily tool embeddings refresh - regenerate if cache expired
  refresh_tool_embeddings:
    class: RefreshToolEmbeddingsJob
    queue: maintenance
    schedule: at 4am every day

  # ========================================
  # Living Platform Jobs - Autonomous Evolution
  # ========================================
  
  # Hourly perception - monitor platform health & detect anomalies
  living_platform_perception:
    class: LivingPlatform::PerceptionJob
    queue: living_platform
    schedule: every hour
  
  # Daily evolution cycle - full improvement cycle (perception, analysis, experimentation)
  living_platform_evolution_daily:
    class: LivingPlatform::EvolutionCycleJob
    queue: living_platform
    schedule: at 3am every day
  
  # Weekly evolution cycle - deeper analysis and experiments
  living_platform_evolution_weekly:
    class: LivingPlatform::EvolutionCycleJob
    queue: living_platform
    schedule: at 4am every sunday
    args:
      - null
      - cycle_type: weekly
  
  # Daily desire engine - generate autonomous goals
  living_platform_desire_engine:
    class: LivingPlatform::DesireEngineJob
    queue: living_platform
    schedule: at 1am every day
  
  # Daily agent reflections - end of day summary for all agents
  living_platform_daily_reflections:
    class: LivingPlatform::DailyAgentReflectionsJob
    queue: living_platform
    schedule: at 11pm every day
  
  # Weekly agent reflections - comprehensive weekly review
  living_platform_weekly_reflections:
    class: LivingPlatform::WeeklyAgentReflectionsJob
    queue: living_platform
    schedule: at 10pm every sunday
  
  # Daily lifecycle evaluation - check for training completion, retirement
  living_platform_lifecycle_evaluation:
    class: LivingPlatform::LifecycleEvaluationJob
    queue: living_platform
    schedule: at 2am every day

# Development environment - run less frequently to avoid noise
development:
  # Daily metrics in dev (just for testing)
  rag_daily_metrics:
    class: Rag::MetricsJob
    queue: maintenance
    schedule: at 2am every day

  # Health check once per hour in dev
  rag_health_check:
    class: Rag::HealthCheckJob
    queue: maintenance
    schedule: every hour
  
  # Clean up temporary uploads every hour
  cleanup_temporary_uploads:
    class: CleanupTemporaryUploadsJob
    queue: maintenance
    schedule: every hour

  # Agent energy regeneration - every 2 hours in dev
  agent_energy_regeneration:
    class: EnergyRegenerationJob
    queue: agents
    schedule: every 2 hours

  # Check for due scheduled tasks every 5 minutes in dev
  scheduled_task_dispatcher:
    class: ScheduledTaskDispatcherJob
    queue: default
    schedule: every 5 minutes

  # Living Platform - hourly perception in dev
  living_platform_perception:
    class: LivingPlatform::PerceptionJob
    queue: living_platform
    schedule: every 2 hours
  
  # Living Platform - daily evolution cycle
  living_platform_evolution_daily:
    class: LivingPlatform::EvolutionCycleJob
    queue: living_platform
    schedule: at 3am every day
  
  # Tool embeddings refresh - once at startup (5 minutes after boot)
  refresh_tool_embeddings:
    class: RefreshToolEmbeddingsJob
    queue: maintenance
    schedule: every day at 3am

# Test environment - disable recurring jobs
test:
  # No recurring jobs in test environment
