# AI Pipeline - Recurring Jobs for Ticket Polling and Workspace Cleanup
production:
  # Poll JIRA/Azure DevOps for new tickets every 5 minutes
  ticket_watcher:
    class: TicketWatcherJob
    queue: pipeline
    schedule: every 5 minutes

  # Cleanup old agent workspaces every hour
  workspace_cleanup:
    class: CleanupWorkspacesJob
    queue: maintenance
    schedule: every hour

development:
  # Same schedule for development environment
  ticket_watcher:
    class: TicketWatcherJob
    queue: pipeline
    schedule: every 5 minutes

  workspace_cleanup:
    class: CleanupWorkspacesJob
    queue: maintenance
    schedule: every hour
