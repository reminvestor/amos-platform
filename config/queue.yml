default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  
  # Scheduler for recurring jobs (reads from config/recurring.yml)
  scheduler:
    polling_interval: 5
    recurring_schedule_file: config/recurring.yml
  
  workers:
    # Critical queue - highest priority (real-time user operations)
    - queues: critical
      threads: 5
      processes: <%= ENV.fetch("CRITICAL_WORKERS", 1) %>
      polling_interval: 0.1
      priority: 10

    # Embeddings queue - API rate limited (AWS Bedrock)
    - queues: embeddings
      threads: 3
      processes: <%= ENV.fetch("EMBEDDING_WORKERS", 1) %>
      polling_interval: 0.5
      priority: 8

    # Docling queue - memory intensive processing
    - queues: docling
      threads: 2
      processes: <%= ENV.fetch("DOCLING_WORKERS", 1) %>
      polling_interval: 1
      priority: 6

    # Documents queue - general RAG processing
    - queues: documents
      threads: 3
      processes: <%= ENV.fetch("DOCUMENT_WORKERS", 1) %>
      polling_interval: 0.5
      priority: 5

    # Agents queue - AI agent jobs (landing pages, emails, etc)
    - queues: agents
      threads: 2
      processes: <%= ENV.fetch("AGENT_WORKERS", 1) %>
      polling_interval: 0.5
      priority: 4

    # Default queue - all other jobs
    - queues: default
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
      priority: 3

    # Learning queue - experience learning, immediate learning, calibration
    - queues: learning
      threads: 2
      processes: 1
      polling_interval: 1
      priority: 3

    # Living Platform queue - AMOS cognition, perception, reflections
    - queues: living_platform
      threads: 2
      processes: 1
      polling_interval: 1
      priority: 2

    # Maintenance queue - background monitoring/cleanup (lowest priority)
    - queues: maintenance
      threads: 1
      processes: 1
      polling_interval: 5
      priority: 1

development:
  <<: *default

test:
  <<: *default
  # Reduce resources in test environment
  workers:
    - queues: "*"
      threads: 1
      processes: 1
      polling_interval: 0.1

production:
  <<: *default
