# Redis adapter allows ActionCable to work across multiple processes (web + workers)
# This is required for SolidQueue workers to broadcast messages to the web server
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: amos_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://redis:6379/1") %>
  channel_prefix: amos_production
