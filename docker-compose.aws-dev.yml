version: '3.8'

services:
  # Main web application (already exists, but configuring for AWS Dev)
  web:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:latest
    restart: always
    ports:
      - "80:3000"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      # Database and Redis connection strings should be set in .env or parameter store
      
  # SolidQueue Worker (Missing in current Dev)
  solidqueue-worker:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:latest
    command: bash -c "bundle exec rake solid_queue:start"
    restart: always
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      # Needs same DB/Redis env vars as web
    depends_on:
      - web

  # Agent Lightning Service (Missing in current Dev)
  agent_lightning:
    build:
      context: ./python_services/agent_lightning
      dockerfile: Dockerfile
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/agent-lightning-dev:latest
    restart: always
    ports:
      - "4747:4747"
    environment:
      - PORT=4747
      - WORKERS=2
      # Needs DB connection string
    depends_on:
      - web

  # Redis (If not using ElastiCache in Dev)
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:

