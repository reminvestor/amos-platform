version: 0.2

# ═══════════════════════════════════════════════════════════════════════════
# Test Stage BuildSpec
# Runs tests inside Docker container to ensure Ruby 3.4.1 compatibility
# ═══════════════════════════════════════════════════════════════════════════

env:
  variables:
    RAILS_ENV: test
    DOCKER_BUILDKIT: "1"

phases:
  pre_build:
    commands:
      - echo "Building test Docker image..."
      - docker build --platform linux/amd64 -t agent-marketing-test:latest -f Dockerfile .

  build:
    commands:
      - echo "Running tests inside Docker container on $(date)"
      
      # Run critical path tests first (fail fast on core functionality)
      - echo "=== Critical Path Tests ==="
      - |
        docker run --rm \
          -e RAILS_ENV=test \
          -e DATABASE_URL="sqlite3:db/test.sqlite3" \
          agent-marketing-test:latest \
          bash -c "bundle exec rails db:create db:schema:load && bundle exec rails test \
            test/models/task_experience_test.rb \
            test/services/learning/ \
            test/services/guidance_library_test.rb \
            test/integration/experience_learning_flow_test.rb \
            test/services/living_platform/ \
            test/services/context_graph/ \
            test/models/decision_trace_test.rb" \
          || exit 1
      
      # Run model tests
      - echo "=== Model Tests ==="
      - |
        docker run --rm \
          -e RAILS_ENV=test \
          -e DATABASE_URL="sqlite3:db/test.sqlite3" \
          agent-marketing-test:latest \
          bash -c "bundle exec rails db:create db:schema:load 2>/dev/null; bundle exec rails test test/models/" \
          || exit 1
      
      # Run service tests
      - echo "=== Service Tests ==="
      - |
        docker run --rm \
          -e RAILS_ENV=test \
          -e DATABASE_URL="sqlite3:db/test.sqlite3" \
          agent-marketing-test:latest \
          bash -c "bundle exec rails db:create db:schema:load 2>/dev/null; bundle exec rails test test/services/" \
          || exit 1
      
      - echo "All tests passed!"

  post_build:
    commands:
      - echo "Tests completed on $(date)"
      - |
        if [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
          echo "✅ All tests passed - proceeding to deploy"
        else
          echo "❌ Tests failed - blocking deploy"
          exit 1
        fi
