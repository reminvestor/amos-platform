version: 0.2

# ═══════════════════════════════════════════════════════════════════════════
# Test Stage BuildSpec
# Runs full test suite using PostgreSQL container for database compatibility
# ═══════════════════════════════════════════════════════════════════════════

env:
  variables:
    RAILS_ENV: test
    DOCKER_BUILDKIT: "1"

phases:
  pre_build:
    commands:
      - echo "Building test Docker image with all dependencies..."
      # Temporarily modify .dockerignore to include test files
      - sed -i 's|^/test/$|#/test/|' .dockerignore
      - sed -i 's|^/spec/$|#/spec/|' .dockerignore
      - docker build --no-cache --platform linux/amd64 -t agent-marketing-test:latest -f Dockerfile.test .
      # Restore .dockerignore (reverse the sed changes)
      - sed -i 's|^#/test/$|/test/|' .dockerignore
      - sed -i 's|^#/spec/$|/spec/|' .dockerignore
      - echo "✅ Test image built successfully!"
      
      - echo "Building PostgreSQL with pgvector..."
      - docker build -t postgres-pgvector:test -f docker/postgres-test.Dockerfile .
      
      - echo "Starting PostgreSQL container..."
      - docker network create test-network || true
      - |
        docker run -d --name test-postgres \
          --network test-network \
          -e POSTGRES_USER=test \
          -e POSTGRES_PASSWORD=testpass \
          -e POSTGRES_DB=agent_marketing_test \
          postgres-pgvector:test
      
      - echo "Starting Redis container..."
      - |
        docker run -d --name test-redis \
          --network test-network \
          redis:7-alpine
      
      - echo "Waiting for PostgreSQL and Redis to be ready..."
      - sleep 10
      - docker exec test-postgres pg_isready -U test || sleep 5
      - docker exec test-redis redis-cli ping || sleep 2

  build:
    commands:
      - echo "Running tests on $(date)"
      - mkdir -p coverage
      
      # Run ALL tests in a single command for proper coverage aggregation
      - echo "=== Running Full Test Suite ==="
      - |
        docker run --rm \
          --network test-network \
          -e RAILS_ENV=test \
          -e DATABASE_URL="postgres://test:testpass@test-postgres:5432/agent_marketing_test" \
          -e REDIS_URL="redis://test-redis:6379/1" \
          -e COVERAGE=true \
          -e CI=true \
          -v $(pwd)/coverage:/rails/coverage \
          agent-marketing-test:latest \
          bash -c "bundle exec rails db:create db:schema:load db:migrate && \
            echo '=== Running All Tests (excluding .deprecated) ===' && \
            find test/models test/services test/controllers test/integration test/jobs test/mailers test/helpers -name '*_test.rb' -not -path '*/\.deprecated/*' | xargs bundle exec rails test" \
          || exit 1
      
      - echo "✅ All tests passed!"
      
      # Display coverage summary if available
      - |
        if [ -f coverage/coverage.xml ]; then
          echo "=== Coverage Report Generated ==="
          ls -la coverage/
        fi

  post_build:
    commands:
      - echo "Cleaning up containers..."
      - docker stop test-postgres test-redis || true
      - docker rm test-postgres test-redis || true
      - docker network rm test-network || true
      - echo "Tests completed on $(date)"
      - |
        if [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
          echo "✅ All tests passed - proceeding to deploy"
        else
          echo "❌ Tests failed - blocking deploy"
          exit 1
        fi

reports:
  coverage-report:
    files:
      - 'coverage/coverage.xml'
    file-format: COBERTURAXML
  test-reports:
    files:
      - 'test/reports/**/*'
    file-format: JUNITXML

cache:
  paths:
    - /root/.cache/docker/**/*
