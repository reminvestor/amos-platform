version: 0.2

# ═══════════════════════════════════════════════════════════════════════════
# Production Build & Deploy with Automatic Migrations
# ═══════════════════════════════════════════════════════════════════════════

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/agent-marketing
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - CLUSTER_NAME="agent-marketing-cluster"
      - SERVICE_NAME="agent-marketing"
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build --platform linux/amd64 -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Updating task definition with new image...
      - cat aws/task-definition.json | jq --arg IMAGE "$REPOSITORY_URI:$IMAGE_TAG" '.containerDefinitions[].image = $IMAGE' > task-definition-new.json
      - echo Registering new task definition with all secrets...
      - NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://task-definition-new.json --region $AWS_DEFAULT_REGION --query 'taskDefinition.taskDefinitionArn' --output text)
      - echo New task definition registered at $NEW_TASK_DEF
      - echo "Running database migrations..."
      - |
        SERVICE_CONFIG=$(aws ecs describe-services \
          --cluster $CLUSTER_NAME \
          --services $SERVICE_NAME \
          --region $AWS_DEFAULT_REGION \
          --query 'services[0].networkConfiguration.awsvpcConfiguration' \
          --output json)
      - SUBNETS=$(echo $SERVICE_CONFIG | jq -r '.subnets | join(",")')
      - SECURITY_GROUPS=$(echo $SERVICE_CONFIG | jq -r '.securityGroups | join(",")')
      - |
        MIGRATION_TASK_ARN=$(aws ecs run-task \
          --cluster $CLUSTER_NAME \
          --task-definition $NEW_TASK_DEF \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
          --overrides '{"containerOverrides":[{"name":"agent-marketing","command":["bash","-c","./bin/rails db:migrate --trace 2>&1; EXIT=$?; echo EXIT_CODE=$EXIT; sleep 5; exit $EXIT"]},{"name":"solid-queue-worker","command":["bash","-c","sleep 30"]}]}' \
          --region $AWS_DEFAULT_REGION \
          --query 'tasks[0].taskArn' \
          --output text)
        echo "Migration task started - $MIGRATION_TASK_ARN"
        MIGRATION_TASK_ID=$(echo $MIGRATION_TASK_ARN | awk -F'/' '{print $NF}')
        echo "Migration task ID - $MIGRATION_TASK_ID"
      - echo "Waiting for migration to complete..."
      - aws ecs wait tasks-stopped --cluster $CLUSTER_NAME --tasks $MIGRATION_TASK_ARN --region $AWS_DEFAULT_REGION
      - |
        MIGRATION_EXIT_CODE=$(aws ecs describe-tasks \
          --cluster $CLUSTER_NAME \
          --tasks $MIGRATION_TASK_ARN \
          --region $AWS_DEFAULT_REGION \
          --query 'tasks[0].containers[?name==`agent-marketing`].exitCode | [0]' \
          --output text)
        echo "Migration exit code: $MIGRATION_EXIT_CODE"
        echo "=== MIGRATION CONTAINER LOGS ==="
        TASK_DETAIL=$(aws ecs describe-tasks \
          --cluster $CLUSTER_NAME \
          --tasks $MIGRATION_TASK_ARN \
          --region $AWS_DEFAULT_REGION \
          --query 'tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason}' \
          --output json)
        echo "Task details: $TASK_DETAIL"
        echo "---"
        aws logs get-log-events \
          --log-group-name /ecs/agent-marketing \
          --log-stream-name "ecs/agent-marketing/$MIGRATION_TASK_ID" \
          --limit 100 \
          --query 'events[*].message' \
          --output text 2>&1 || echo "(no logs available)"
        echo "=== END MIGRATION LOGS ==="
        if [ "$MIGRATION_EXIT_CODE" = "0" ]; then
          echo "Migrations completed successfully!"
        elif [ "$MIGRATION_EXIT_CODE" = "None" ] || [ "$MIGRATION_EXIT_CODE" = "null" ]; then
          echo "Migration exit code unavailable (container may have crashed). Checking task status..."
          TASK_STATUS=$(aws ecs describe-tasks --cluster $CLUSTER_NAME --tasks $MIGRATION_TASK_ARN --region $AWS_DEFAULT_REGION --query 'tasks[0].stopCode' --output text)
          echo "Task stop code: $TASK_STATUS"
          echo "Proceeding with deploy - migrations may have already been applied"
        else
          echo "Migration failed with exit code: $MIGRATION_EXIT_CODE"
          exit 1
        fi
      - echo Deploying to ECS...
      - aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $NEW_TASK_DEF --force-new-deployment --region $AWS_DEFAULT_REGION
      - echo Writing image definitions file for CodePipeline...
      - printf '[{"name":"agent-marketing","imageUri":"%s"},{"name":"solid-queue-worker","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - echo "Deploy completed on $(date)"

artifacts:
  files: imagedefinitions.json
